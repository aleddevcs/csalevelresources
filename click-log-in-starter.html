<body>
<div class="topbar"><b>Click Log In</b><span class="tag">Unit 5 NEA · Investigation · Lesson 6</span></div>
<div class="wrap">
<h1>What happens when you click Log in?</h1>
<p class="lede">Predict first, learn second. Choose what you think happens between pressing Sign in and seeing your account page. You will come back and compare after the technology tour.</p>

<div class="twoc">
  <div class="panel login" id="login">
    <div class="lh">CAVC Library</div>
    <label for="s-email">Email address</label>
    <input id="s-email" type="text" placeholder="you@example.com" autocomplete="off">
    <label for="s-pw">Password</label>
    <input id="s-pw" type="password" placeholder="Password" autocomplete="off">
    <button class="btn primary" id="signin" type="button">Sign in</button>
    <div class="then" id="then" aria-live="polite"></div>
  </div>
  <div id="stage"></div>
</div>

</div>
<script>
var QS = [{"id": "q1", "t": "Where is the password checked?", "kind": "one", "opts": [["browser", "In my browser"], ["server", "On the web server, by code the site's owner wrote"], ["db", "Inside the database itself"], ["unsure", "Not sure yet"]], "a": "server", "real": "On the web server, by PHP code", "why": "In this system PHP does the checking. The database only hands over the stored record, and the browser cannot be trusted with the decision."}, {"id": "q2", "t": "Where are the user accounts kept?", "kind": "one", "opts": [["device", "On my own device"], ["file", "In a file on the web server"], ["db", "In a table in a database"], ["unsure", "Not sure yet"]], "a": "db", "real": "In a table in a database", "why": "A users table holds one row per account: email, first name, surname, password and an admin flag."}, {"id": "q3", "t": "What is stored for your password?", "kind": "one", "opts": [["plain", "The password exactly as you typed it"], ["hash", "A scrambled version (a hash) that cannot be turned back"], ["none", "Nothing, the browser remembers it"], ["unsure", "Not sure yet"]], "a": "hash", "real": "A scrambled version, called a hash", "why": "PHP's password_verify() compares what you typed with the stored hash, so a stolen table does not reveal anyone's password."}, {"id": "q4", "t": "Which of these are involved in a login? Tick every one you think is.", "kind": "many", "opts": [["browser", "Your browser"], ["server", "A web server (Apache, running on UWAMP)"], ["php", "PHP code"], ["db", "The database"]], "a": ["browser", "server", "php", "db"], "real": "All four", "why": "The browser sends the request, the web server receives it and runs the PHP, and the PHP asks the database."}, {"id": "q5", "t": "The form refuses a blank password in the browser before anything is sent. Does the server still need to check?", "kind": "one", "opts": [["no", "No, the browser has already checked"], ["yes", "Yes, because browser checks can be skipped or edited"], ["unsure", "Not sure yet"]], "a": "yes", "real": "Yes, the server must check too", "why": "Browser checks save a trip and help the user. Only the server's checks are security. signin.php checks for empty fields itself."}];
var JOURNEY = [["browser", "You press Sign in. Your browser packs the email and password into a request and sends it to the server."], ["server", "The web server (Apache on UWAMP) receives the request and hands it to signin.php."], ["php", "signin.php checks both fields are filled in, then asks the database for the row with that email."], ["db", "The database looks in the users table and sends back the matching row, or nothing."], ["php", "PHP uses password_verify() to compare what you typed with the stored hash."], ["php", "Match: PHP starts your session and sends you to the account page. No match: it saves an error message and sends you back to the login page."]];
var ZONES = {"browser": ["Browser", "p-browser"], "server": ["Web server", "p-server"], "php": ["PHP", "t-php"], "db": ["Database", "p-db"]};

var $ = function(id){ return document.getElementById(id); };
var ans = {}, steps = "", phase = "predict";
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function labelFor(q, key){ var o = q.opts.filter(function(o){ return o[0] === key; })[0]; return o ? o[1] : ""; }
function answered(){
  return QS.every(function(q){ return q.kind === "many" ? (ans[q.id] && ans[q.id].length) : !!ans[q.id]; });
}
function count(){ return QS.filter(function(q){ return q.kind === "many" ? (ans[q.id] && ans[q.id].length) : ans[q.id]; }).length; }
function yourText(q){
  if (q.kind === "many") return (ans[q.id] || []).map(function(k){ return labelFor(q, k); }).join("; ");
  return labelFor(q, ans[q.id]);
}
function verdict(q){
  if (q.kind === "many"){
    var got = ans[q.id] || [];
    var all = q.a.every(function(k){ return got.indexOf(k) > -1; }) && got.length === q.a.length;
    return all ? "match" : "miss";
  }
  if (ans[q.id] === "unsure") return "new";
  return ans[q.id] === q.a ? "match" : "miss";
}
function render(){
  var st = $("stage"); st.innerHTML = "";
  if (phase === "predict") renderPredict(st);
  else if (phase === "locked") renderLocked(st);
  else renderCompare(st);
}
function renderPredict(st){
  var intro = el("div", "panel qb");
  intro.appendChild(el("div", "qn", "STEP 1 OF 3 · PREDICT"));
  intro.appendChild(el("h2", "", "You click Sign in. Then what?"));
  var p = el("p", "hint", "Nothing here is marked and you are not expected to know yet. Choose what you think happens. After the technology tour you will compare.");
  p.style.margin = "4px 0 0"; intro.appendChild(p);
  st.appendChild(intro);
  QS.forEach(function(q, qi){
    var card = el("div", "panel qb");
    card.appendChild(el("div", "qn", "PREDICTION " + (qi + 1) + " OF " + QS.length));
    card.appendChild(el("h2", "", q.t));
    var box = el("div", "choices");
    q.opts.forEach(function(o){
      var b = el("button", "ch"); b.type = "button";
      var on = q.kind === "many" ? (ans[q.id] || []).indexOf(o[0]) > -1 : ans[q.id] === o[0];
      b.setAttribute("aria-pressed", on ? "true" : "false");
      var mark = el("span", "box " + (q.kind === "many" ? "sq" : "rad"), on && q.kind === "many" ? "✓" : "");
      b.appendChild(mark); b.appendChild(el("span", "", o[1]));
      b.onclick = function(){
        if (q.kind === "many"){
          var cur = ans[q.id] || [], i = cur.indexOf(o[0]);
          if (i > -1) cur.splice(i, 1); else cur.push(o[0]);
          ans[q.id] = cur;
        } else ans[q.id] = o[0];
        keepScroll();
      };
      box.appendChild(b);
    });
    card.appendChild(box); st.appendChild(card);
  });
  var sk = el("div", "panel qb");
  sk.appendChild(el("div", "qn", "OPTIONAL"));
  sk.appendChild(el("h2", "", "Write the journey in your own words"));
  sk.appendChild(el("p", "hint", "List the steps between pressing Sign in and seeing your account page, as far as you can."));
  var ta = el("textarea", "sk"); ta.id = "s-steps"; ta.placeholder = "1. ...\n2. ..."; ta.value = steps;
  ta.setAttribute("aria-label", "Your steps"); ta.oninput = function(){ steps = ta.value; };
  sk.appendChild(ta); st.appendChild(sk);
  var row = el("div", "row");
  var lock = el("button", "btn primary", "Lock in my predictions"); lock.type = "button"; lock.disabled = !answered();
  lock.onclick = function(){ phase = "locked"; render(); window.scrollTo(0, 0); };
  row.appendChild(lock);
  row.appendChild(el("span", "hint", answered() ? "Ready to lock in." : count() + " of " + QS.length + " answered. Answer them all to lock in."));
  st.appendChild(row);
}
function keepScroll(){ var y = window.scrollY; render(); window.scrollTo(0, y); }
function renderLocked(st){
  var p = el("div", "panel qb");
  p.appendChild(el("div", "qn", "STEP 2 OF 3 · LOCKED IN"));
  p.appendChild(el("h2", "", "Predictions locked"));
  var h = el("p", "hint", "Keep this tab open. Go on with the technology tour, then come back and compare.");
  h.style.margin = "4px 0 0"; p.appendChild(h);
  var list = el("div", "qlist");
  QS.forEach(function(q){
    var r = el("div", "qrow"); r.appendChild(el("div", "qq", q.t)); r.appendChild(el("div", "you", "You predicted: " + yourText(q))); list.appendChild(r);
  });
  p.appendChild(list);
  if (steps.trim()){ p.appendChild(el("div", "hint", "Your steps:")); p.appendChild(el("div", "mine", steps)); }
  st.appendChild(p);
  var g = el("div", "panel qb");
  g.appendChild(el("h2", "", "After the tour"));
  var lab = el("label", "gate"); var cb = el("input"); cb.type = "checkbox"; cb.id = "s-gate";
  lab.appendChild(cb); lab.appendChild(el("span", "", "The technology tour is finished. Show me the real journey."));
  g.appendChild(lab);
  var row = el("div", "row");
  var go = el("button", "btn primary", "Compare with the real journey"); go.type = "button"; go.disabled = true;
  cb.onchange = function(){ go.disabled = !cb.checked; };
  go.onclick = function(){ phase = "compare"; render(); window.scrollTo(0, 0); };
  var back = el("button", "btn", "Change my answers"); back.type = "button";
  back.onclick = function(){ phase = "predict"; render(); };
  row.appendChild(go); row.appendChild(back); g.appendChild(row); st.appendChild(g);
}
function renderCompare(st){
  var matched = QS.filter(function(q){ return verdict(q) === "match"; }).length;
  var head = el("div", "panel qb");
  head.appendChild(el("div", "qn", "STEP 3 OF 3 · COMPARE"));
  head.appendChild(el("h2", "", "You matched " + matched + " of " + QS.length));
  var n = el("p", "hint", "This is not a mark. Anything you missed is exactly what the tour was for, and it is what your technical justification will explain.");
  n.style.margin = "4px 0 0"; head.appendChild(n);
  var list = el("div", "qlist");
  QS.forEach(function(q){
    var v = verdict(q);
    var r = el("div", "qrow " + v);
    var top = el("div", "qq"); top.appendChild(el("span", "badge2", v === "match" ? "MATCH" : v === "new" ? "NEW TO YOU" : "MISSED")); top.appendChild(document.createTextNode(q.t));
    r.appendChild(top);
    r.appendChild(el("div", "you", "You predicted: " + yourText(q)));
    r.appendChild(el("div", "really", "What happens: " + q.real));
    r.appendChild(el("div", "why", q.why));
    list.appendChild(r);
  });
  head.appendChild(list); st.appendChild(head);
  var j = el("div", "panel qb");
  j.appendChild(el("h2", "", "The real journey"));
  var ol = el("ol", "steps");
  JOURNEY.forEach(function(s){
    var li = el("li"); var wrap = el("div"); var pill = el("span", "pill " + ZONES[s[0]][1], ZONES[s[0]][0]);
    wrap.appendChild(pill); wrap.appendChild(document.createElement("br")); wrap.appendChild(document.createTextNode(s[1])); li.appendChild(wrap); ol.appendChild(li);
  });
  j.appendChild(ol); st.appendChild(j);
  if (steps.trim()){
    var m = el("div", "panel qb"); m.appendChild(el("h2", "", "Your own steps"));
    m.appendChild(el("p", "hint", "Tick off what you got right and add what you missed."));
    m.appendChild(el("div", "mine", steps)); st.appendChild(m);
  }
  var row = el("div", "row");
  var again = el("button", "btn", "Start again"); again.type = "button";
  again.onclick = function(){ ans = {}; steps = ""; phase = "predict"; $("then").textContent = ""; render(); window.scrollTo(0, 0); };
  row.appendChild(again); st.appendChild(row);
}
$("signin").onclick = function(){ $("then").textContent = "…then what?"; var s = $("stage"); if (s.scrollIntoView && window.innerWidth < 800) s.scrollIntoView({behavior: "smooth"}); };
render();

</script>
