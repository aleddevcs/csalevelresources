<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic & Boolean Explorer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX processing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .font-mono { font-family: 'JetBrains+Mono', monospace; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        .logic-overline {
            border-top: 2px solid currentColor;
            padding-top: 1px;
            margin-top: 2px;
            display: inline-block;
            line-height: 1;
        }
        
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1em;
            padding-right: 2.5rem;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        /**
         * Reliable Built-in Icon Component
         * Uses internal SVG paths to guarantee rendering without external libraries.
         */
        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {
                Cpu: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                        <rect x="9" y="9" width="6" height="6"></rect>
                        <line x1="9" y1="1" x2="9" y2="4"></line>
                        <line x1="15" y1="1" x2="15" y2="4"></line>
                        <line x1="9" y1="20" x2="9" y2="23"></line>
                        <line x1="15" y1="20" x2="15" y2="23"></line>
                        <line x1="20" y1="9" x2="23" y2="9"></line>
                        <line x1="20" y1="15" x2="23" y2="15"></line>
                        <line x1="1" y1="9" x2="4" y2="9"></line>
                        <line x1="1" y1="15" x2="4" y2="15"></line>
                    </svg>
                ),
                Binary: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <rect x="14" y="14" width="4" height="6" rx="2"></rect>
                        <rect x="6" y="4" width="4" height="6" rx="2"></rect>
                        <path d="M6 20h4"></path>
                        <path d="M14 10h4"></path>
                        <path d="M8 14v6"></path>
                        <path d="M16 4v6"></path>
                    </svg>
                ),
                Calculator: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                        <line x1="8" y1="6" x2="16" y2="6"></line>
                        <line x1="16" y1="14" x2="16" y2="14.01"></line>
                        <line x1="12" y1="14" x2="12" y2="14.01"></line>
                        <line x1="8" y1="14" x2="8" y2="14.01"></line>
                        <line x1="16" y1="18" x2="16" y2="18.01"></line>
                        <line x1="12" y1="18" x2="12" y2="18.01"></line>
                        <line x1="8" y1="18" x2="8" y2="18.01"></line>
                        <line x1="12" y1="10" x2="12" y2="10.01"></line>
                        <line x1="8" y1="10" x2="8" y2="10.01"></line>
                        <line x1="16" y1="10" x2="16" y2="10.01"></line>
                    </svg>
                ),
                ShieldCheck: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="M9 12l2 2 4-4"></path>
                    </svg>
                ),
                Trash2: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                ),
                Eye: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                ),
                ArrowRight: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                ),
                ChevronRight: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                ),
                CheckCircle: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11"></polyline>
                    </svg>
                )
            };

            return icons[name] || <span className="w-4 h-4 bg-slate-200 rounded-full inline-block"></span>;
        };

        // --- MODULE: GATE SIMULATOR ---
        const GateSimulator = () => {
            const [selectedGate, setSelectedGate] = useState('AND');
            const [inA, setInA] = useState(0);
            const [inB, setInB] = useState(0);

            const gates = {
                'AND': { symbol: '·', logic: (a, b) => a & b, desc: 'True only if both inputs are true.' },
                'OR': { symbol: '+', logic: (a, b) => a | b, desc: 'True if at least one input is true.' },
                'NOT': { symbol: 'Ā', logic: (a) => (a === 0 ? 1 : 0), desc: 'Inverts the input signal.', single: true },
                'XOR': { symbol: '⊕', logic: (a, b) => a ^ b, desc: 'True if inputs are different.' },
                'NAND': { symbol: '↑', logic: (a, b) => (a & b ? 0 : 1), desc: 'Opposite of AND.' },
                'NOR': { symbol: '↓', logic: (a, b) => (a | b ? 0 : 1), desc: 'Opposite of OR.' },
            };

            const currentGate = gates[selectedGate];
            const output = currentGate.single ? currentGate.logic(inA) : currentGate.logic(inA, inB);
            const tableRows = currentGate.single ? [0, 1] : [[0, 0], [0, 1], [1, 0], [1, 1]];

            return (
                <div className="grid lg:grid-cols-2 gap-8 items-start animate-in">
                    <div className="space-y-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <h2 className="text-xl font-bold mb-4 flex items-center gap-2 text-slate-800">
                                <Icon name="Cpu" className="text-blue-600" size={20} />
                                Gate Sandbox
                            </h2>
                            <div className="grid grid-cols-3 gap-2 mb-6">
                                {Object.keys(gates).map(g => (
                                    <button key={g} onClick={() => setSelectedGate(g)}
                                        className={`py-2 rounded-lg text-sm font-semibold transition-all border ${selectedGate === g ? 'bg-blue-600 text-white border-blue-600 shadow-lg shadow-blue-100' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-300'}`}>{g}</button>
                                ))}
                            </div>
                            <p className="text-slate-500 text-sm italic mb-8">{currentGate.desc}</p>
                            <div className="flex items-center justify-around py-8 bg-slate-50 rounded-xl border border-slate-100 relative">
                                <div className="flex flex-col items-center gap-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-tighter">INPUT A</span>
                                    <button onClick={() => setInA(inA === 0 ? 1 : 0)}
                                        className={`w-14 h-14 rounded-2xl flex items-center justify-center text-xl font-mono font-bold transition-all shadow-md active:scale-95 ${inA === 1 ? 'bg-blue-500 text-white shadow-blue-200' : 'bg-white text-slate-400'}`}>{inA}</button>
                                </div>
                                <div className="text-4xl font-serif text-slate-300">{currentGate.symbol}</div>
                                {!currentGate.single && (
                                    <div className="flex flex-col items-center gap-2">
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-tighter">INPUT B</span>
                                        <button onClick={() => setInB(inB === 0 ? 1 : 0)}
                                            className={`w-14 h-14 rounded-2xl flex items-center justify-center text-xl font-mono font-bold transition-all shadow-md active:scale-95 ${inB === 1 ? 'bg-blue-500 text-white shadow-blue-200' : 'bg-white text-slate-400'}`}>{inB}</button>
                                    </div>
                                )}
                                <div className="text-slate-300"><Icon name="ArrowRight" size={24} /></div>
                                <div className="flex flex-col items-center gap-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-tighter">RESULT</span>
                                    <div className={`w-16 h-16 rounded-full flex items-center justify-center text-2xl font-mono font-bold transition-all shadow-inner border-4 ${output === 1 ? 'bg-emerald-50 border-emerald-400 text-emerald-600' : 'bg-slate-200 border-slate-300 text-slate-400'}`}>{output}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <h2 className="text-xl font-bold mb-4 flex items-center gap-2 text-slate-800"><Icon name="Eye" className="text-blue-600" size={20} /> Truth Table: {selectedGate}</h2>
                        <table className="w-full text-center border-collapse">
                            <thead>
                                <tr className="bg-slate-50 text-slate-400 text-xs font-bold uppercase tracking-wider">
                                    <th className="p-3 border-b border-slate-100 text-center">A</th>
                                    {!currentGate.single && <th className="p-3 border-b border-slate-100 text-center">B</th>}
                                    <th className="p-3 border-b border-slate-100 bg-blue-50 text-blue-600 text-center uppercase tracking-tighter font-black">Y ({selectedGate})</th>
                                </tr>
                            </thead>
                            <tbody className="font-mono text-lg">
                                {tableRows.map((row, idx) => {
                                    const isMatch = currentGate.single ? row === inA : row[0] === inA && row[1] === inB;
                                    const val = currentGate.single ? currentGate.logic(row) : currentGate.logic(row[0], row[1]);
                                    return (
                                        <tr key={idx} className={`transition-colors ${isMatch ? 'bg-blue-50 ring-2 ring-blue-500 ring-inset' : 'hover:bg-slate-50'}`}>
                                            <td className="p-3 border-b border-slate-50">{currentGate.single ? row : row[0]}</td>
                                            {!currentGate.single && <td className="p-3 border-b border-slate-50">{row[1]}</td>}
                                            <td className={`p-3 border-b border-slate-50 font-bold ${val === 1 ? 'text-emerald-600' : 'text-slate-400'}`}>{val}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // --- MODULE: BITWISE WORKSHOP ---
        const BitwiseWorkshop = () => {
            const [data, setData] = useState([1, 0, 1, 1, 1, 0, 1, 1]);
            const [mask, setMask] = useState([0, 0, 1, 0, 0, 0, 0, 0]);
            const [op, setOp] = useState('AND');

            const toggleBit = (arr, index, setter) => {
                const newArr = [...arr];
                newArr[index] = newArr[index] === 0 ? 1 : 0;
                setter(newArr);
            };

            const calculateResult = () => data.map((bit, i) => op === 'AND' ? bit & mask[i] : bit ^ mask[i]);
            const result = calculateResult();

            const BinaryRow = ({ label, bits, onToggle, readOnly, color }) => {
                const colorMap = { blue: 'bg-blue-600', amber: 'bg-amber-500', emerald: 'bg-emerald-600' };
                return (
                    <div className="flex flex-col md:flex-row md:items-center gap-4">
                        <div className="w-32 shrink-0"><span className="text-[10px] font-black text-slate-400 uppercase tracking-tighter">{label}</span></div>
                        <div className="flex gap-1 md:gap-2 flex-grow">
                            {bits.map((bit, i) => (
                                <button key={i} disabled={readOnly} onClick={() => onToggle && onToggle(i)}
                                    className={`flex-1 aspect-square md:h-12 rounded-lg flex items-center justify-center font-mono font-bold transition-all border shadow-sm ${bit === 1 ? `${colorMap[color]} text-white border-transparent` : 'bg-white text-slate-300 border-slate-200 hover:border-blue-300'} ${readOnly ? 'cursor-default' : 'active:scale-95 hover:scale-105'}`}>{bit}</button>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-6 animate-in">
                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                            <div><h2 className="text-2xl font-bold text-slate-800 tracking-tight">8-Bit Workshop</h2><p className="text-slate-500 text-sm">Manipulate registers using masking, clearing, and encryption techniques.</p></div>
                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                                {['AND', 'XOR'].map(o => (
                                    <button key={o} onClick={() => setOp(o)} className={`px-6 py-2 rounded-lg text-sm font-bold transition-all ${op === o ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>{o}</button>
                                ))}
                            </div>
                        </div>
                        <div className="space-y-4">
                            <BinaryRow label="ORIGINAL DATA" bits={data} onToggle={(i) => toggleBit(data, i, setData)} color="blue" />
                            <div className="flex justify-center items-center py-2 text-slate-400 font-mono text-xs font-bold uppercase tracking-widest">{op} OPERATOR</div>
                            <BinaryRow label="MASK / KEY" bits={mask} onToggle={(i) => toggleBit(mask, i, setMask)} color="amber" />
                            <div className="pt-4 border-t-2 border-slate-100 mt-4"><BinaryRow label="RESULT" bits={result} readOnly color="emerald" /></div>
                        </div>
                    </div>
                    <div className="grid md:grid-cols-3 gap-4">
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:border-blue-300 transition-colors cursor-pointer group" onClick={() => { setOp('AND'); setMask([0,0,1,0,0,0,0,0]); }}>
                            <div className="flex items-center gap-3 mb-2 text-blue-600 transition-colors"><Icon name="ShieldCheck" size={20} /><h3 className="font-bold text-slate-800">Masking</h3></div>
                            <p className="text-sm text-slate-500">Isolate a specific bit. Click to set a mask for the 3rd MSB.</p>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:border-red-300 transition-colors cursor-pointer group" onClick={() => { setOp('AND'); setMask([0,0,0,0,0,0,0,0]); }}>
                            <div className="flex items-center gap-3 mb-2 text-red-500 transition-colors"><Icon name="Trash2" size={20} /><h3 className="font-bold text-slate-800">Clearing</h3></div>
                            <p className="text-sm text-slate-500">Wipe the register using AND 00000000.</p>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:border-purple-300 transition-colors cursor-pointer group" onClick={() => { setOp('XOR'); setMask([...data]); }}>
                            <div className="flex items-center gap-3 mb-2 text-purple-600 transition-colors"><Icon name="CheckCircle" size={20} /><h3 className="font-bold text-slate-800">XOR Clear</h3></div>
                            <p className="text-sm text-slate-500">Clear a register by XORing with itself. Click to try.</p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MODULE: SIMPLIFICATION ENGINE ---
        const SimplificationEngine = () => {
            const [view, setView] = useState('laws');
            const [activeWalkthrough, setActiveWalkthrough] = useState(0);
            const [step, setStep] = useState(0);

            // Robust Recursive Parser for Overlines
            const LogicText = ({ text }) => {
                if (!text) return null;
                let outerBracketStart = -1;
                let depth = 0;

                for (let i = 0; i < text.length; i++) {
                    if (text[i] === '[') {
                        if (depth === 0) outerBracketStart = i;
                        depth++;
                    } else if (text[i] === ']') {
                        depth--;
                        if (depth === 0 && outerBracketStart !== -1) {
                            const before = text.slice(0, outerBracketStart);
                            const inner = text.slice(outerBracketStart + 1, i);
                            const after = text.slice(i + 1);
                            return (
                                <span className="inline-flex items-baseline font-mono whitespace-nowrap">
                                    {before && <span>{before}</span>}
                                    <span className="logic-overline mx-px">
                                        <LogicText text={inner} />
                                    </span>
                                    {after && <LogicText text={after} />}
                                </span>
                            );
                        }
                    }
                }
                return <span>{text}</span>;
            };

            const laws = [
                { name: 'Identity', exprs: ['A + 0 = A', 'A · 1 = A'] },
                { name: 'Annulment', exprs: ['A + 1 = 1', 'A · 0 = 0'] },
                { name: 'Idempotent', exprs: ['A + A = A', 'A · A = A'] },
                { name: 'Complement', exprs: ['A + [A] = 1', 'A · [A] = 0'] },
                { name: 'Commutative', exprs: ['A + B = B + A', 'A · B = B · A'] },
                { name: 'Absorption', exprs: ['A + (A·B) = A', 'A·(A + B) = A'] },
                { name: 'De Morgan\'s', exprs: ['[A+B] = [A] · [B]', '[A·B] = [A] + [B]'] },
                { name: 'Involution', exprs: ['[[A]] = A'] },
            ];

            const walkthroughs = [
                { 
                    title: "Full Simplification", 
                    expr: "AB + A(B + C) + B(B + C)", 
                    steps: [
                        { exp: "AB + AB + AC + B(B + C)", law: "Distributive" }, 
                        { exp: "AB + AC + B(B + C)", law: "Idempotent (AB + AB = AB)" }, 
                        { exp: "AB + AC + BB + BC", law: "Distributive" }, 
                        { exp: "AB + AC + B + BC", law: "Idempotent (BB = B)" }, 
                        { exp: "AC + B + BC", law: "Absorption (B + AB = B)" }, 
                        { exp: "AC + B", law: "Absorption (B + BC = B)" }
                    ]
                },
                { 
                    title: "De Morgan Logic", 
                    expr: "[ [A] + B ]", 
                    steps: [
                        { exp: "[[A]] · [B]", law: "De Morgan's (Flip + to ·, Negate terms)" }, 
                        { exp: "A · [B]", law: "Involution (Double negation cancels)" }
                    ]
                }
            ];

            const currentW = walkthroughs[activeWalkthrough];

            return (
                <div className="space-y-6 animate-in">
                    <div className="flex bg-white p-1 rounded-xl border border-slate-200 w-fit">
                        <button onClick={() => setView('laws')} className={`px-6 py-2 rounded-lg font-bold text-sm transition-all ${view === 'laws' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100'}`}>Law Reference</button>
                        <button onClick={() => {setView('walkthrough'); setStep(0)}} className={`px-6 py-2 rounded-lg font-bold text-sm transition-all ${view === 'walkthrough' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100'}`}>Interactive Steps</button>
                    </div>
                    {view === 'laws' ? (
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {laws.map(law => (
                                <div key={law.name} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                                    <h3 className="font-bold text-blue-600 mb-3 border-b border-slate-50 pb-2">{law.name}</h3>
                                    <div className="space-y-2 flex-grow text-slate-700">
                                        {law.exprs.map((expr, i) => (
                                            <div key={i} className="bg-slate-50 p-2 rounded text-center text-sm font-semibold">
                                                <LogicText text={expr} />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm min-h-[400px] flex flex-col">
                            <div className="flex items-center justify-between mb-8">
                                <h2 className="text-xl font-bold text-slate-800">Interactive Steps</h2>
                                <select className="bg-slate-50 border-none text-sm font-bold p-2 rounded-lg outline-none ring-1 ring-slate-200 cursor-pointer" 
                                    onChange={(e) => { setActiveWalkthrough(parseInt(e.target.value)); setStep(0); }} value={activeWalkthrough}>
                                    {walkthroughs.map((w, i) => <option key={i} value={i}>{w.title}</option>)}
                                </select>
                            </div>
                            <div className="flex-grow flex flex-col justify-center items-center text-center space-y-12">
                                <div>
                                    <p className="text-xs font-black text-slate-300 uppercase mb-4 tracking-widest">EXPRESSION</p>
                                    <div className="text-3xl md:text-5xl font-mono text-blue-600 font-bold leading-relaxed">
                                        <LogicText text={step === 0 ? currentW.expr : currentW.steps[step - 1].exp} />
                                    </div>
                                </div>
                                {step < currentW.steps.length ? (
                                    <button onClick={() => setStep(step + 1)} className="group flex flex-col items-center gap-4 hover:-translate-y-1 transition-transform focus:outline-none">
                                        <div className="bg-blue-600 p-5 rounded-full text-white shadow-xl group-hover:bg-blue-700 shadow-blue-100 transition-colors">
                                            <Icon name="ChevronRight" size={32} className="text-white" />
                                        </div>
                                        <div className="space-y-1">
                                            <p className="text-lg font-bold text-slate-800">Apply {currentW.steps[step].law}</p>
                                            <p className="text-xs text-slate-400 uppercase tracking-widest uppercase">Step {step + 1} of {currentW.steps.length}</p>
                                        </div>
                                    </button>
                                ) : (
                                    <div className="bg-emerald-50 text-emerald-700 px-12 py-10 rounded-3xl border-2 border-emerald-100 flex flex-col items-center gap-3 animate-in">
                                        <Icon name="CheckCircle" size={48} className="text-emerald-500" />
                                        <span className="font-black text-sm uppercase tracking-widest mt-2">Final Result</span>
                                        <button onClick={() => setStep(0)} className="mt-4 text-xs font-bold text-emerald-600 hover:underline uppercase tracking-tighter">RESTART WALKTHROUGH</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('gates');
            const tabs = [
                { id: 'gates', label: 'Logic Gates', iconName: 'Cpu' },
                { id: 'bitwise', label: 'Bitwise Workshop', iconName: 'Binary' },
                { id: 'simplification', label: 'Simplification', iconName: 'Calculator' }
            ];

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-blue-100 pb-12">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-lg text-white shadow-inner">
                                    <Icon name="Binary" size={24} className="text-white" />
                                </div>
                                <h1 className="text-xl font-black tracking-tight text-slate-800">Logic & Boolean Explorer</h1>
                            </div>
                            <nav className="flex gap-1">
                                {tabs.map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-3 py-2 rounded-full text-sm font-bold transition-all ${activeTab === tab.id ? 'bg-blue-100 text-blue-700' : 'text-slate-500 hover:bg-slate-50'}`}>
                                        <Icon name={tab.iconName} size={18} />
                                        <span className="hidden sm:inline ml-1">{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>
                    <main className="max-w-5xl mx-auto px-4 py-8">
                        {activeTab === 'gates' && <GateSimulator />}
                        {activeTab === 'bitwise' && <BitwiseWorkshop />}
                        {activeTab === 'simplification' && <SimplificationEngine />}
                    </main>
                    <footer className="text-center py-10 border-t border-slate-200 text-slate-400 text-xs font-medium">
                        <p>© 2024 Computer Science Learning Resource • Topic 2: Logical Operations</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
