<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Validation Lab</title>
<style>
:root{
  --navy:#003366; --amber:#CC9900; --amberText:#8A6700;
  --bg:#FFFFFF; --panel:#EEF3F8; --ink:#1F2A36; --muted:#5B6B7B; --line:#C8D4E1; --code:#F3F6FA;
  --head:#003366; --soft:#FBF3DD;
  --ok:#1E7B4A; --okBg:#E3F3EA; --bad:#B03A3A; --badBg:#F9E6E6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#9CC2E8; --amberText:#E8C052; --bg:#0D1824; --panel:#15263A; --ink:#E4ECF4; --muted:#9FB1C4;
    --line:#2B4159; --code:#112030; --head:#001F3F; --soft:#33290E;
    --ok:#6FD19B; --okBg:#143324; --bad:#F29A9A; --badBg:#3A1C1C;
  }
}
:root[data-theme="dark"]{
  --navy:#9CC2E8; --amberText:#E8C052; --bg:#0D1824; --panel:#15263A; --ink:#E4ECF4; --muted:#9FB1C4;
  --line:#2B4159; --code:#112030; --head:#001F3F; --soft:#33290E;
  --ok:#6FD19B; --okBg:#143324; --bad:#F29A9A; --badBg:#3A1C1C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,"Segoe UI",Carlito,Arial,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3{font-family:Cambria,Caladea,Georgia,serif;margin:0}
.mono{font-family:"Courier New",Courier,monospace}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

header{background:var(--head);color:#fff;padding:18px 24px 0}
.hrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;max-width:1280px;margin:0 auto}
header h1{font-size:28px}
.spec{font-size:15px;color:#C9D6E3}
.progress{font-size:15px;color:#C9D6E3}
.progress b{color:#FFD966}
nav{display:flex;gap:4px;max-width:1280px;margin:14px auto 0;overflow-x:auto}
nav button{background:transparent;color:#C9D6E3;border:0;border-radius:10px 10px 0 0;padding:10px 16px;font-size:17px;font-weight:700;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--bg);color:var(--navy)}
nav .n{display:inline-block;width:22px;height:22px;border-radius:50%;background:#CC9900;color:#1F2A36;font-size:13px;line-height:22px;text-align:center;margin-right:6px}
nav .tick{color:#FFD966;margin-left:6px}
nav button[aria-selected="true"] .tick{color:var(--amberText)}

main{max-width:1280px;margin:0 auto;padding:20px 24px 40px}
.top h2{font-size:24px;color:var(--navy)}
.prompt{background:var(--soft);border-radius:10px;padding:12px 16px;margin:10px 0 16px}
.prompt b{color:var(--amberText)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:12px;padding:16px}
.panel h3{font-size:18px;color:var(--navy);margin-bottom:10px}
.btn{border:0;border-radius:8px;padding:10px 20px;font-weight:700;font-size:16px}
.btn.primary{background:#003366;color:#fff}
.btn.accent{background:#CC9900;color:#1F2A36}
.btn.ghost{background:var(--bg);color:var(--navy);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.feedback{margin-top:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:12px 16px}
.feedback h3{font-size:16px;color:var(--navy);margin-bottom:6px}
.feedback ul{margin:0;padding-left:20px}
.feedback li{margin:4px 0}
.sum{font-weight:700;margin:0 0 6px}
.sum.ok{color:var(--ok)} .sum.bad{color:var(--bad)}

/* form */
.form{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px}
.form h3{margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-weight:700;font-size:15px;color:var(--navy);margin-bottom:4px}
.field input{width:100%;border:2px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font-family:"Courier New",monospace;font-size:16px}
.field input.err{border-color:var(--bad)}
.field .msg{color:var(--bad);font-size:14px;margin-top:3px;font-weight:700}
.field .hintline{color:var(--muted);font-size:13px}
.show{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:10px}
.toggles{display:grid;gap:8px}
.tg{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tg input{width:20px;height:20px;accent-color:#CC9900;flex:none}
.tg .k{font-weight:700;color:var(--navy)}
.tg .d{font-size:14px;color:var(--muted)}
.tg .kind{margin-left:auto;font-size:12px;font-weight:700;border-radius:10px;padding:2px 8px;flex:none}
.kind.v{background:#003366;color:#fff}
.kind.vf{background:#CC9900;color:#1F2A36}
.subh{font-size:14px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.confirm{margin-top:12px;border:2px solid var(--amber);border-radius:10px;padding:12px;background:var(--soft)}
.confirm table{border-collapse:collapse;margin:6px 0 10px;font-family:"Courier New",monospace;font-size:15px}
.confirm td{padding:2px 12px 2px 0}
.dbwrap{overflow-x:auto;margin-top:6px}
table.db{border-collapse:collapse;width:100%;min-width:460px;font-size:14px}
table.db th{background:#003366;color:#fff;text-align:left;padding:6px 8px;font-weight:700}
table.db td{border-bottom:1px solid var(--line);padding:6px 8px;font-family:"Courier New",monospace;vertical-align:top;background:var(--bg)}
table.db td.rub{background:var(--badBg);color:var(--bad)}
table.db td .why{display:block;font-family:Calibri,Arial,sans-serif;font-size:12px;font-weight:700}
.empty{color:var(--muted);font-size:15px;padding:10px 0}
.chal{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.chal li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:15px}
.chal .box{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.chal li.done{border-color:var(--ok);background:var(--okBg)}
.chal li.done .box{background:var(--ok);border-color:var(--ok)}
.saved{margin-top:10px;font-weight:700;color:var(--ok)}

/* which check */
.scard{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.scard .ctx{font-size:15px;color:var(--muted)}
.scard .fld{font-size:20px;font-weight:700;color:var(--navy);margin:6px 0 4px}
.scard .val{font-family:"Courier New",monospace;font-size:22px;font-weight:700;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:inline-block;min-width:120px}
.scard .rule{margin-top:8px;font-size:15px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.choice{text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:700}
.choice:hover:not(:disabled){border-color:var(--navy)}
.choice:disabled{cursor:default}
.choice.ok{border-color:var(--ok);background:var(--okBg)}
.choice.bad{border-color:var(--bad);background:var(--badBg)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--muted);font-weight:700;font-size:13px}
.dot[aria-current="true"]{border-color:var(--navy);color:var(--navy)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.bad{background:var(--bad);border-color:var(--bad);color:#fff}

/* sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border:2px dashed var(--line);border-radius:10px;background:var(--bg)}
.scrd{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px 12px;font-size:15px;text-align:left;max-width:100%}
.scrd:hover{border-color:var(--navy)}
.scrd[aria-pressed="true"]{border-color:var(--amber);background:var(--soft)}
.scrd.ok{border-color:var(--ok);background:var(--okBg)}
.scrd.bad{border-color:var(--bad);background:var(--badBg)}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
@media (max-width:900px){.bins{grid-template-columns:1fr}}
.bin{border-radius:12px;padding:12px;min-height:200px;border:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:8px}
.bin.drop{border-color:var(--amber)}
.bin .bh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bin h3{font-size:19px;margin:0}
.bin .add{background:#003366;color:#fff;border:0;border-radius:6px;padding:4px 10px;font-size:14px;font-weight:700}
.bin.v h3{color:var(--navy)} .bin.vf h3{color:var(--amberText)}

/* parsons */
.pgrid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:20px;align-items:start}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}}
pre.ref{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap;margin:0 0 10px;overflow-x:auto;color:var(--ink)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:6px 10px;font-family:"Courier New",monospace;font-size:14.5px}
.chip:hover:not(:disabled){border-color:var(--navy)}
.chip:disabled{opacity:.35;cursor:default}
.answer{list-style:none;margin:0;padding:0;counter-reset:ln;min-height:60px;background:var(--code);border:1px solid var(--line);border-radius:8px}
.answer:empty::before{content:"Click lines in the bank to add them here.";display:block;padding:16px;color:var(--muted);font-size:15px}
.answer li{display:flex;align-items:center;gap:8px;padding:3px 8px;border-bottom:1px solid var(--line);counter-increment:ln}
.answer li:last-child{border-bottom:0}
.answer li::before{content:counter(ln);width:22px;color:var(--muted);font-size:13px;text-align:right;flex:none}
.answer li.fixed{background:var(--panel)}
.answer .txt{flex:1;font-family:"Courier New",monospace;font-size:14px;white-space:pre;overflow-x:auto}
.answer li.ok{background:var(--okBg)}
.answer li.bad{background:var(--badBg)}
.ctl{display:flex;gap:3px;flex:none}
.ctl button{width:28px;height:28px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font-size:13px;padding:0}
.tester{margin-top:16px}
.trow{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.trow label{display:grid;gap:3px;font-size:14px;color:var(--muted)}
.trow input{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink);font-family:"Courier New",monospace;width:150px}
.out{background:#0F1E2E;color:#E4ECF4;border-radius:8px;padding:10px 12px;font-family:"Courier New",monospace;font-size:15px;margin-top:10px;white-space:pre-wrap;min-height:48px}
.tests{margin-top:10px;font-size:15px}
.tests li{margin:3px 0}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:760px){.stages{grid-template-columns:1fr 1fr}}
.stg{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.stg small{color:var(--muted);font-size:13px}
.stg b{font-family:"Courier New",monospace;font-size:14px}
.stg .sn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--panel);color:var(--navy);font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.stg.cur{border-color:#CC9900;background:var(--soft)}
.stg.done .sn{background:var(--ok);color:#fff}
.stg:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div><h1>Validation Lab</h1><div class="spec">Unit 3 · 3.3.1 · Work in pairs</div></div>
    <div class="progress" id="progress"></div>
  </div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>

<script>
function h(tag,attrs={},...kids){const n=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')n.className=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v===true?'':v);}kids.flat().forEach(c=>{if(c==null||c===false)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c);});return n;}
function seeded(arr,seed){const a=arr.slice();let s=seed;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= rules ================= */
const R={
  presence:v=>v.trim()!=='',
  length:v=>v.length>=8&&v.length<=16,
  type:v=>/^-?\d+$/.test(v.trim()),
  range:v=>{const n=Number(v.trim());return v.trim()!==''&&!isNaN(n)&&n>=16&&n<=99;},
  format:v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.trim()),
};
const CHECKS=[
  {k:'presence',name:'Presence check',field:'username',d:'Username must not be blank',kind:'v',msg:'Presence check failed: username cannot be blank.'},
  {k:'length',name:'Length check',field:'password',d:'Password must be 8 to 16 characters',kind:'v',msg:'Length check failed: password must be 8 to 16 characters.'},
  {k:'type',name:'Type check',field:'age',d:'Age must be a whole number',kind:'v',msg:'Type check failed: age must be a whole number.'},
  {k:'range',name:'Range check',field:'age',d:'Age must be between 16 and 99',kind:'v',msg:'Range check failed: age must be between 16 and 99.'},
  {k:'format',name:'Format check',field:'email',d:'Email must look like name@site.com',kind:'v',msg:'Format check failed: email must match the pattern name@site.com.'},
  {k:'double',name:'Double entry',field:'confirm',d:'Both passwords must match',kind:'vf',msg:'Double entry check failed: the two passwords do not match.'},
  {k:'proof',name:'Proofreading',field:null,d:'Show the details back to the user to confirm',kind:'vf'},
];
const CHALS=[
  {id:'blank',t:'Store a record with a blank username'},
  {id:'short',t:'Store a password shorter than 8 characters'},
  {id:'nan',t:'Store an age that is not a number'},
  {id:'old',t:'Store an age of 150'},
  {id:'at',t:'Store an email address with no @ in it'},
  {id:'mism',t:'Store a record where the two passwords do not match'},
];

const S={tab:0,
  form:{v:{username:'',password:'',confirm:'',age:'',email:''},on:{},errs:{},db:[],pending:null,show:false,saved:false,done:new Set(),revealWrong:false},
  wc:{i:0,ans:{}},
  vv:{place:{},sel:null,checked:false,done:false},ps:null
};

/* ================= TAB 1: Break the form ================= */
function flaws(r){
  const f={};
  if(!R.presence(r.username))f.username='blank';
  if(r.password.length<8)f.password='too short';else if(r.password.length>16)f.password='too long';
  if(r.password!==r.confirm)f.password=(f.password?f.password+', ':'')+'does not match';
  if(!R.type(r.age))f.age='not a whole number';else if(!R.range(r.age))f.age='out of range';
  if(!R.format(r.email))f.email='bad format';
  return f;
}
function updateChallenges(){
  const F=S.form;
  F.db.forEach(r=>{
    if(!R.presence(r.username))F.done.add('blank');
    if(r.password.length<8)F.done.add('short');
    if(!/^\s*-?\d+(\.\d+)?\s*$/.test(r.age)||isNaN(Number(r.age)))F.done.add('nan');
    if(Number(r.age)===150)F.done.add('old');
    if(!r.email.includes('@'))F.done.add('at');
    if(r.password!==r.confirm)F.done.add('mism');
  });
}
function formView(){
  const F=S.form;
  const allOn=CHECKS.every(c=>F.on[c.k]);
  const inp=(key,label,type,hint)=>{
    const i=h('input',{id:'f_'+key,type:(type==='password'&&!F.show)?'password':'text',autocomplete:'off',spellcheck:'false',class:F.errs[key]?'err':null});
    i.value=F.v[key];i.addEventListener('input',()=>{F.v[key]=i.value;F.saved=false;});
    return h('div',{class:'field'},h('label',{for:'f_'+key},label),i,
      hint?h('div',{class:'hintline'},hint):null,
      ...(F.errs[key]||[]).map(m=>h('div',{class:'msg',role:'alert'},m)));
  };
  const submit=()=>{
    const v=F.v;const errs={};const add=(k,m)=>{(errs[k]=errs[k]||[]).push(m);};
    CHECKS.forEach(c=>{
      if(!F.on[c.k]||!c.field)return;
      if(c.k==='double'){if(v.password!==v.confirm)add('confirm',c.msg);return;}
      if(!R[c.k](v[c.field]))add(c.field,c.msg);
    });
    F.errs=errs;F.saved=false;
    if(Object.keys(errs).length){render();return;}
    if(F.on.proof){F.pending={...v};render();return;}
    save({...v});
  };
  const save=r=>{F.db.push(r);F.pending=null;F.saved=true;F.errs={};updateChallenges();render();};
  const form=h('div',{class:'form'},h('h3',{},'Create an account'),
    inp('username','Username','text'),
    inp('password','Password','password'),
    inp('confirm','Confirm password','password'),
    inp('age','Age','text'),
    inp('email','Email','text'),
    h('label',{class:'show'},h('input',{type:'checkbox',checked:F.show||null,onchange:e=>{F.show=e.target.checked;render();}}),'Show passwords'),
    h('div',{class:'actions',style:'margin-top:4px'},
      h('button',{class:'btn primary',onclick:submit},'Create account'),
      h('button',{class:'btn ghost',onclick:()=>{Object.keys(F.v).forEach(k=>F.v[k]='');F.errs={};F.pending=null;F.saved=false;render();}},'Clear form')),
    F.pending?h('div',{class:'confirm',role:'dialog','aria-label':'Proofreading check'},
      h('b',{},'Proofreading: please check your details'),
      h('table',{},...['username','age','email'].map(k=>h('tr',{},h('td',{},k),h('td',{},F.pending[k]||'(blank)')))),
      h('div',{},'Is this information correct?'),
      h('div',{class:'actions'},h('button',{class:'btn primary',onclick:()=>save(F.pending)},'Yes, save it'),
        h('button',{class:'btn ghost',onclick:()=>{F.pending=null;render();}},'No, go back and fix it'))):null,
    F.saved?h('div',{class:'saved',role:'status'},'✓ Account created and stored in the database.'):null);

  const toggles=h('div',{class:'toggles'});
  const mk=c=>h('label',{class:'tg'},h('input',{type:'checkbox',checked:F.on[c.k]||null,onchange:e=>{F.on[c.k]=e.target.checked;F.errs={};render();}}),
    h('span',{},h('span',{class:'k'},c.name),h('br'),h('span',{class:'d'},c.d)),h('span',{class:'kind '+c.kind},c.kind==='v'?'validation':'verification'));
  toggles.append(h('div',{class:'subh'},'Validation checks'),...CHECKS.filter(c=>c.kind==='v').map(mk),
    h('div',{class:'subh'},'Verification methods'),...CHECKS.filter(c=>c.kind==='vf').map(mk));

  const rows=F.db.map(r=>{const f=flaws(r);const cell=(k,val)=>h('td',{class:f[k]?'rub':null},val===''?'(blank)':val,f[k]?h('span',{class:'why'},f[k]):null);
    return h('tr',{},cell('username',r.username),cell('password',F.show?r.password:'•'.repeat(r.password.length)+` (${r.password.length})`),cell('age',r.age),cell('email',r.email));});
  const db=h('div',{class:'panel',style:'margin-top:20px'},
    h('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'},h('h3',{style:'margin:0'},'Database: users table'),
      h('button',{class:'btn ghost',onclick:()=>{F.db=[];F.done=new Set();F.saved=false;render();}},'Empty the database')),
    F.db.length?h('div',{class:'dbwrap'},h('table',{class:'db'},h('thead',{},h('tr',{},...['username','password (length)','age','email'].map(t=>h('th',{},t)))),h('tbody',{},...rows)))
      :h('div',{class:'empty'},'No records stored yet.'),
    F.db.length?h('p',{style:'margin:8px 0 0;font-size:14px;color:var(--muted)'},'Red cells are rubbish data that got stored.'):null);

  const chal=h('ul',{class:'chal'},CHALS.map(c=>h('li',{class:F.done.has(c.id)?'done':null},h('span',{class:'box'},F.done.has(c.id)?'✓':''),c.t)));
  const stage2=h('div',{class:'panel',style:'margin-top:14px'},
    h('h3',{},'Round 2: switch every check on'),

const IF_BLOCKS=[

 {name:'ValidateSignUp',head:'Declare ValidateSignUp(username, password, age)',tester:'signup',extension:true,

function psView(){
  const si=S.ps.stage,st=STAGES[si],P=S.ps.st[si];
  const used=new Set(P.answer.map(a=>a.b));
  const bank=h('div',{class:'bank'},st.bank.map((it,bi)=>h('button',{class:'chip',disabled:used.has(bi)||null,onclick:()=>{P.answer.push({b:bi,indent:1});P.marks=null;P.fb=null;render();}},it.text)));
  const ol=h('ol',{class:'answer','aria-label':'Your pseudo-code'});
  const fixedLi=t=>h('li',{class:'fixed'},h('span',{class:'txt'},t),h('span',{class:'ctl',style:'font-size:12px;color:var(--muted)'},'given'));
  ol.appendChild(fixedLi(st.head));
  const chg=()=>{P.marks=null;P.fb=null;render();};
  const mv=(j,d)=>{const t=j+d;if(t<0||t>=P.answer.length)return;[P.answer[j],P.answer[t]]=[P.answer[t],P.answer[j]];chg();};
  P.answer.forEach((a,j)=>{
    const it=st.bank[a.b];const cls=P.marks?(P.marks[j]?'ok':'bad'):null;
    ol.appendChild(h('li',{class:cls},h('span',{class:'txt'},'    '.repeat(a.indent)+it.text),
      h('span',{class:'ctl'},
        h('button',{'aria-label':'Outdent',onclick:()=>{a.indent=Math.max(0,a.indent-1);chg();}},'←'),
        h('button',{'aria-label':'Indent',onclick:()=>{a.indent=Math.min(3,a.indent+1);chg();}},'→'),
        h('button',{'aria-label':'Move up',onclick:()=>mv(j,-1)},'↑'),
        h('button',{'aria-label':'Move down',onclick:()=>mv(j,1)},'↓'),
        h('button',{'aria-label':'Remove',onclick:()=>{P.answer.splice(j,1);chg();}},'×'))));
  });
  ol.appendChild(fixedLi('End Subroutine'));
  const check=()=>{
    const ans=P.answer.map(a=>({t:st.bank[a.b].text,ind:a.indent,it:st.bank[a.b]}));
    let best=null,bs=-1;
    st.solutions.forEach(sol=>{let sc=0;ans.forEach((a,j)=>{if(sol[j]&&sol[j][1]===a.t&&sol[j][0]===a.ind)sc++;});if(sc>bs){bs=sc;best=sol;}});
    const items=[];
    P.marks=ans.map((a,j)=>{
      const s=best[j];
      if(s&&s[1]===a.t&&s[0]===a.ind)return true;
      if(a.it.dis)items.push(`Line ${j+2} "${a.t}": ${a.it.why}`);
      else if(!best.some(x=>x[1]===a.t))items.push(`Line ${j+2} "${a.t}" is not needed in this version.`);
      else if(s&&s[1]===a.t)items.push(`Line ${j+2} "${a.t}" is in the right place but the indentation is wrong. Lines inside an if or else are indented one more level.`);
      else items.push(`Line ${j+2} "${a.t}" is in the wrong position.`);
      return false;});
    const n=best.length;
    if(ans.length<n)items.push(`${n-ans.length} line${n-ans.length>1?'s are':' is'} still missing.`);
    const ok=bs===n&&ans.length===n;
    if(ok&&!P.revealed)P.solved=true;
    P.fb={ok,items:ok?[st.after]:items,summary:ok?(P.revealed?'Correct, but the answer was revealed. Reset and try from memory to complete this stage.':`Correct. ${st.name} works.`):`${bs} of ${n} lines correct.`};
    render();
  };
  const reveal=()=>{
    P.revealed=true;const usedB=new Set();
    P.answer=st.solutions[0].map(([ind,t])=>{const bi=st.bank.findIndex((it,k)=>it.text===t&&!usedB.has(k));usedB.add(bi);return {b:bi,indent:ind};});
    P.marks=null;P.fb={ok:true,items:[...st.dis.map(([t,w])=>`Not used, "${t}": ${w}`),st.after],summary:'Answer revealed.'};render();
  };
  const stageBar=h('div',{class:'stages'},STAGES.map((x,i)=>{

    return h('button',{class:'stg'+(i===si?' cur':'')+(S2.solved?' done':''),disabled:lock||null,'aria-current':String(i===si),

      h('span',{class:'sn'},S2.solved?'✓':String(i+1)),h('span',{},h('b',{},x.name),h('br'),h('small',{},lock?'locked':x.extension?'extension':S2.solved?'complete':'to do')));
  }));
  const fb=P.fb?h('div',{class:'feedback'},h('p',{class:'sum '+(P.fb.ok?'ok':'bad')},P.fb.summary),P.fb.items.length?h('ul',{},...P.fb.items.map(t=>h('li',{},t))):null):null;
  const nextBtn=(P.solved||P.revealed)&&si<STAGES.length-1?h('button',{class:'btn accent',onclick:()=>{S.ps.stage++;render();}},si===2?'Extension: put it together →':`Next: ${STAGES[si+1].name} →`):null;
  const ref=si===3?h('div',{class:'panel',style:'margin-bottom:14px'},h('h3',{},'Your subroutines'),
    h('pre',{class:'ref mono'},'PresenceCheck(data)\n  → TRUE if data is not empty\n\nLengthCheck(data, minLength, maxLength)\n  → TRUE if the length is between min and max\n\nRangeCheck(value, minValue, maxValue)\n  → TRUE if the value is between min and max')):null;
  return h('div',{},
    h('div',{class:'top'},h('h2',{},'Build the sign-up validator')),
    h('div',{class:'prompt'},h('b',{},'Task: '),'Build each validation check as its own subroutine, then combine them. Each stage unlocks when the one before is complete.'),
    stageBar,
    h('div',{class:'prompt',style:'background:var(--panel)'},h('b',{},`Stage ${si+1}: ${st.name}. `),st.prompt,` ${st.dis.length} line${st.dis.length>1?'s':''} in the bank ${st.dis.length>1?'are distractors':'is a distractor'}.`),
    h('div',{class:'pgrid'},
      h('div',{},ref,h('div',{class:'panel'},h('h3',{},'Line bank'),bank)),
      h('div',{},h('div',{class:'panel'},h('h3',{},'Your pseudo-code'),ol),
        h('div',{class:'actions'},
          h('button',{class:'btn primary',disabled:!P.answer.length||null,onclick:check},'Check'),
          h('button',{class:'btn ghost',onclick:()=>{const keep=P.solved;S.ps.st[si]=newStage();S.ps.st[si].solved=keep;render();}},'Reset'),
          h('button',{class:'btn ghost',onclick:reveal},'Show answer'),nextBtn),
        fb,(P.solved||P.revealed)?testerView(si):null)));
}

/* ================= shell ================= */
const TABS=[{t:'Break the Form',v:formView,done:()=>S.form.done.size===CHALS.length},
  {t:'Which check?',v:wcView,done:()=>Object.keys(S.wc.ans).length===WC.length},
  {t:'Validation or verification?',v:vvView,done:()=>S.vv.done},
  {t:'Build the validator',v:psView,done:()=>S.ps.st.slice(0,3).every(x=>x.solved)}];
function render(){
  const nav=document.getElementById('tabs');nav.innerHTML='';
  TABS.forEach((t,i)=>nav.appendChild(h('button',{role:'tab','aria-selected':String(i===S.tab),onclick:()=>{S.tab=i;render();}},h('span',{class:'n'},String(i+1)),t.t,t.done()?h('span',{class:'tick'},'✓'):null)));
  document.getElementById('progress').innerHTML=`<b>${TABS.filter(t=>t.done()).length}</b> of 4 tabs complete`;
  const main=document.getElementById('main');
  const active=document.activeElement&&document.activeElement.id;
  main.innerHTML='';main.appendChild(TABS[S.tab].v());
  if(active&&active.startsWith('f_')){const el=document.getElementById(active);if(el)el.focus();}
}
render();
</script>
