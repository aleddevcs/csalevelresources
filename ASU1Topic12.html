<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDE Lifecycle Simulator</title>
    <!-- Load React, Tailwind, and Lucide Icons via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        
        /* Custom scrollbar for the console */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
        
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const apiKey = ""; // The execution environment provides the key at runtime

        // Simple Icon Component to bridge Lucide to React in this browser environment
        const Icon = ({ name, size = 16, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [currentPhase, setCurrentPhase] = useState(1);
            const [editorState, setEditorState] = useState({
                formatted: false,
                colored: false,
                syntaxFixed: false,
                showContext: false,
            });
            const [buildState, setBuildState] = useState({
                compiled: false,
                linked: false,
                loaded: false,
                error: null,
            });
            const [logs, setLogs] = useState(["[System] IDE Initialized. Ready for coding."]);
            const [isTyping, setIsTyping] = useState(false);
            
            // AI State
            const [aiLoading, setAiLoading] = useState(false);
            const [aiResponse, setAiResponse] = useState(null);

            const addLog = (msg) => setLogs(prev => [...prev, `> ${msg}`].slice(-5));

            // --- GEMINI API INTEGRATION ---
            const callGemini = async (prompt, systemPrompt = "You are a helpful software engineering tutor.") => {
                setAiLoading(true);
                setAiResponse(null);
                
                const fetchWithRetry = async (retries = 0) => {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                systemInstruction: { parts: [{ text: systemPrompt }] }
                            })
                        });

                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text;
                    } catch (err) {
                        if (retries < 5) {
                            const delay = Math.pow(2, retries) * 1000;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            return fetchWithRetry(retries + 1);
                        }
                        throw err;
                    }
                };

                try {
                    const result = await fetchWithRetry();
                    setAiResponse(result);
                } catch (err) {
                    addLog("AI Error: Failed to connect to Gemini API after multiple retries.");
                } finally {
                    setAiLoading(false);
                }
            };

            const handleAiExplain = () => {
                const code = editorState.syntaxFixed ? 'if (x == 10) { print("Hello World"); x = x + 1; }' : 'if x == 10 prnt("Hello World") x = x + 1 endif';
                callGemini(`Explain this code snippet for a beginner software engineering student. Focus on how the IDE tools would help manage it: \n\n${code}`);
                addLog("✨ AI Assistant is analyzing your code structure...");
            };

            const handleAiFixAndLearn = () => {
                if (editorState.syntaxFixed) {
                    callGemini("Explain why 'print' is a keyword and how Syntax Error Detection works in a modern IDE.");
                } else {
                    callGemini("The user has a typo 'prnt' instead of 'print'. Explain to a student why this causes a syntax error and how an IDE detects this in real-time.");
                }
                addLog("✨ AI Assistant is diagnosing code errors...");
            };

            const handleAiOptimize = () => {
                callGemini("Based on section 1.15 of the software engineering notes (Code Optimisation), suggest one optimization or warning for this code snippet: 'if (x == 10) { print(\"Hello World\"); x = x + 1; }'. Keep it brief.");
                addLog("✨ AI Assistant is performing Code Optimisation...");
            };

            // --- PHASE 1 ACTIONS ---
            const handleFormat = () => {
                setEditorState(prev => ({ ...prev, formatted: true }));
                addLog("Automatic Formatting applied: Code indented and aligned.");
            };

            const handleColour = () => {
                setEditorState(prev => ({ ...prev, colored: true }));
                addLog("Automatic Colour Coding: Keywords, variables, and comments highlighted.");
            };

            const handleFixSyntax = () => {
                setEditorState(prev => ({ ...prev, syntaxFixed: true }));
                addLog("Syntax Error Detection: Typo 'prnt' corrected to 'print'.");
            };

            const toggleContext = () => {
                setEditorState(prev => ({ ...prev, showContext: !prev.showContext }));
                if (!editorState.showContext) addLog("Context-Sensitive Menu: Showing relevant suggestions for 'print'.");
            };

            // --- PHASE 2 ACTIONS ---
            const handleCompile = () => {
                if (!editorState.syntaxFixed) {
                    setBuildState(prev => ({ ...prev, error: "Compilation Failed: Syntax error at Line 2. 'prnt' is undefined." }));
                    addLog("Error Diagnostics: Identified undefined command at Line 2.");
                    return;
                }
                setBuildState(prev => ({ ...prev, compiled: true, error: null }));
                addLog("Compiler: Source code translated to machine code.");
            };

            const handleLink = () => {
                if (!buildState.compiled) return;
                setBuildState(prev => ({ ...prev, linked: true }));
                addLog("Linker: Combined compiled code with MathLibrary.obj into single executable.");
            };

            const handleLoad = () => {
                if (!buildState.linked) return;
                setIsTyping(true);
                setTimeout(() => {
                    setBuildState(prev => ({ ...prev, loaded: true }));
                    setIsTyping(false);
                    addLog("Loader: Executable loaded into memory address 0x4F22.");
                }, 1500);
            };

            const getCodeContent = () => {
                if (!editorState.syntaxFixed && !editorState.formatted && !editorState.colored) {
                    return (
                        <pre className="font-mono text-sm opacity-70 whitespace-pre">
                            {"// messy code\nif x == 10\nprnt(\"Hello World\")\nx = x + 1\nendif"}
                        </pre>
                    );
                }
                
                let indent = editorState.formatted ? "  " : "";
                let kwClass = editorState.colored ? "text-purple-400" : "text-white";
                let strClass = editorState.colored ? "text-green-400" : "text-white";

                return (
                    <div className="font-mono text-sm leading-relaxed">
                        <div className="text-gray-500">// Mobile App Controller</div>
                        <div>
                            <span className={kwClass}>if</span> (x == 10) <span className="text-gray-400 ml-2 italic text-xs">// Statement Completion added brackets</span>
                        </div>
                        <div className="relative group cursor-pointer" onClick={toggleContext}>
                            {indent}
                            <span className={!editorState.syntaxFixed ? "border-b-2 border-red-500 font-bold text-red-400" : kwClass}>
                                {editorState.syntaxFixed ? "print" : "prnt"}
                            </span>
                            (<span className={strClass}>"Hello World"</span>)
                            {!editorState.syntaxFixed && (
                                <div className="absolute -top-8 left-0 bg-red-600 text-white text-[10px] px-2 py-1 rounded shadow-lg pointer-events-none whitespace-nowrap z-30 font-sans">
                                    Syntax Error: Use 'print'
                                </div>
                            )}
                            {editorState.showContext && (
                                <div className="absolute top-6 left-4 z-40 bg-gray-800 border border-gray-600 rounded-md shadow-2xl py-1 w-48 text-xs font-sans">
                                    <div className="px-3 py-1 hover:bg-blue-600 cursor-pointer flex items-center gap-2">
                                        <Icon name="mouse-pointer-2" size={12}/> print() - Standard Output
                                    </div>
                                    <div className="px-3 py-1 hover:bg-blue-600 cursor-pointer flex items-center gap-2">
                                        <Icon name="mouse-pointer-2" size={12}/> println() - New Line
                                    </div>
                                </div>
                            )}
                        </div>
                        <div>{indent}x = x + 1</div>
                        <div><span className={kwClass}>end if</span></div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="max-w-6xl mx-auto mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-white flex items-center gap-3">
                                <Icon name="settings" size={28} className="text-blue-500" /> IDE Lifecycle Simulator
                            </h1>
                            <p className="text-slate-400">Software Engineering Interactive Resource</p>
                        </div>
                        <div className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                            {[1, 2, 3].map(phase => (
                                <button
                                    key={phase}
                                    onClick={() => setCurrentPhase(phase)}
                                    className={`px-4 py-2 rounded-md transition-all text-sm font-medium ${
                                        currentPhase === phase 
                                        ? 'bg-blue-600 text-white shadow-lg' 
                                        : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    Phase {phase}
                                </button>
                            ))}
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Sidebar: Tools Panel */}
                        <div className="lg:col-span-3 space-y-4">
                            <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-4">
                                <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4">Standard IDE Tools</h3>
                                <div className="space-y-2">
                                    {currentPhase === 1 && (
                                        <>
                                            <ToolButton active={editorState.formatted} onClick={handleFormat} icon="wand-2" label="Auto Formatting" />
                                            <ToolButton active={editorState.colored} onClick={handleColour} icon="zap" label="Colour Coding" />
                                            <ToolButton active={editorState.syntaxFixed} onClick={handleFixSyntax} icon="alert-circle" label="Fix Syntax Errors" />
                                        </>
                                    )}
                                    {currentPhase === 2 && (
                                        <>
                                            <ToolButton active={buildState.compiled} onClick={handleCompile} icon="cpu" label="Run Compiler" />
                                            <ToolButton active={buildState.linked} disabled={!buildState.compiled} onClick={handleLink} icon="layers" label="Link Libraries" />
                                            <ToolButton active={buildState.loaded} disabled={!buildState.linked} onClick={handleLoad} icon="play" label="Load to RAM" />
                                        </>
                                    )}
                                    {currentPhase === 3 && (
                                        <div className="p-3 bg-blue-900/20 border border-blue-800 rounded-lg text-sm text-blue-200">
                                            <p className="mb-2"><strong>Emulator Tool:</strong></p>
                                            <p>Code is running in a virtual hardware environment.</p>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* AI ASSISTANT PANEL */}
                            <div className="bg-indigo-900/30 border border-indigo-500/30 rounded-xl p-4 shadow-xl">
                                <h3 className="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                                    <Icon name="sparkles" size={14} /> AI Assistant Tools
                                </h3>
                                <div className="space-y-2">
                                    <button 
                                        onClick={handleAiExplain}
                                        disabled={aiLoading}
                                        className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg border border-indigo-500/30 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-200 text-xs font-medium transition-all disabled:opacity-50"
                                    >
                                        {aiLoading ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="info" />}
                                        ✨ Explain Logic
                                    </button>
                                    <button 
                                        onClick={handleAiFixAndLearn}
                                        disabled={aiLoading}
                                        className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg border border-indigo-500/30 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-200 text-xs font-medium transition-all disabled:opacity-50"
                                    >
                                        {aiLoading ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="bug" />}
                                        ✨ Fix & Learn
                                    </button>
                                    <button 
                                        onClick={handleAiOptimize}
                                        disabled={aiLoading}
                                        className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg border border-indigo-500/30 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-200 text-xs font-medium transition-all disabled:opacity-50"
                                    >
                                        {aiLoading ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="zap" />}
                                        ✨ Optimize Code
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Center: Work Area */}
                        <div className="lg:col-span-6 space-y-6">
                            <div className="bg-[#1e293b] rounded-xl border border-slate-700 overflow-hidden shadow-2xl min-h-[450px] flex flex-col relative">
                                
                                {/* AI Response Overlay */}
                                {aiResponse && (
                                    <div className="absolute inset-x-0 top-12 z-50 p-6 animate-in fade-in slide-in-from-top-4 duration-300">
                                        <div className="bg-slate-800 border-2 border-indigo-500 rounded-xl shadow-2xl p-6 text-sm relative">
                                            <button 
                                                onClick={() => setAiResponse(null)}
                                                className="absolute top-2 right-2 p-1 hover:bg-slate-700 rounded text-slate-400"
                                            >
                                                <Icon name="x" size={16} />
                                            </button>
                                            <div className="flex items-center gap-2 text-indigo-400 font-bold mb-3">
                                                <Icon name="sparkles" size={18} /> AI Insight
                                            </div>
                                            <div className="text-slate-200 leading-relaxed whitespace-pre-wrap max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                                                {aiResponse}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-slate-800 px-4 py-2 border-b border-slate-700 flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <div className="flex gap-1.5">
                                            <div className="w-3 h-3 rounded-full bg-red-500" />
                                            <div className="w-3 h-3 rounded-full bg-amber-500" />
                                            <div className="w-3 h-3 rounded-full bg-green-500" />
                                        </div>
                                        <span className="text-xs text-slate-400 font-mono ml-4">main.app</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-xs text-slate-500 font-mono">
                                        <Icon name="code-2" size={14}/> UTF-8
                                    </div>
                                </div>

                                <div className="p-6 flex-grow overflow-auto relative">
                                    {currentPhase === 1 ? (
                                        <div className="flex">
                                            <div className="text-slate-600 text-right pr-4 border-r border-slate-700 select-none font-mono text-sm leading-relaxed">
                                                1<br/>2<br/>3<br/>4<br/>5
                                            </div>
                                            <div className="pl-4 w-full">
                                                {getCodeContent()}
                                            </div>
                                        </div>
                                    ) : currentPhase === 2 ? (
                                        <div className="flex flex-col items-center justify-center h-full py-10 space-y-8">
                                            <div className="flex items-center gap-4 w-full max-w-xs">
                                                <div className={`p-3 rounded-lg border-2 ${buildState.compiled ? 'bg-green-900/20 border-green-500 text-green-500' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>
                                                    <Icon name="code-2" size={24} />
                                                </div>
                                                <div className="h-0.5 flex-grow bg-slate-700 relative overflow-hidden">
                                                    {buildState.compiled && <div className="absolute inset-0 bg-blue-500 animate-pulse" />}
                                                </div>
                                                <div className={`p-3 rounded-lg border-2 ${buildState.linked ? 'bg-green-900/20 border-green-500 text-green-500' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>
                                                    <Icon name="layers" size={24} />
                                                </div>
                                            </div>
                                            
                                            {isTyping && <div className="text-blue-400 font-mono text-sm animate-pulse">Loading to RAM...</div>}
                                            {!isTyping && buildState.loaded && (
                                                <div className="text-center p-6 bg-green-900/20 rounded-xl border border-green-800">
                                                    <Icon name="check-circle-2" size={48} className="text-green-500 mx-auto mb-2" />
                                                    <h4 className="text-lg font-bold text-white">Ready for Testing</h4>
                                                    <button onClick={() => setCurrentPhase(3)} className="mt-4 px-6 py-2 bg-green-600 hover:bg-green-500 rounded-lg text-white font-bold transition-all">Launch Emulator</button>
                                                </div>
                                            )}
                                            {buildState.error && (
                                                <div className="bg-red-900/20 border border-red-800 p-4 rounded-lg text-red-300 text-xs">
                                                    <strong>Error Diagnostics:</strong> {buildState.error}
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="flex justify-center">
                                            <div className="relative w-60 h-[380px] bg-black rounded-[2.5rem] border-8 border-slate-800 shadow-2xl p-4 flex flex-col items-center justify-center space-y-4 overflow-hidden">
                                                <div className="w-16 h-1 bg-slate-800 rounded-full mb-2" />
                                                <div className="bg-slate-900 w-full h-full rounded-xl flex flex-col items-center justify-center p-4">
                                                    <Icon name="smartphone" size={64} className="text-blue-500 animate-pulse" />
                                                    <div className="text-center mt-4">
                                                        <h5 className="text-white font-bold">App Simulation</h5>
                                                        <div className="mt-2 bg-slate-800 p-2 rounded text-[10px] font-mono text-left w-full border border-slate-700">
                                                            <p className="text-green-400">&gt; Starting...</p>
                                                            <p className="text-blue-400 mt-1">"Hello World"</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-slate-900 border-t border-slate-700 h-32 flex flex-col">
                                    <div className="flex items-center gap-2 px-4 py-1.5 bg-slate-800 text-[10px] uppercase font-bold text-slate-500">
                                        <Icon name="terminal" size={12} /> Output Console
                                    </div>
                                    <div className="p-3 font-mono text-xs overflow-y-auto custom-scrollbar flex-grow">
                                        {logs.map((log, i) => (
                                            <div key={i} className="mb-1 text-slate-400 transition-all">{log}</div>
                                        ))}
                                        {aiLoading && <div className="text-indigo-400 animate-pulse flex items-center gap-2"><Icon name="sparkles" size={12}/> AI Assistant is processing...</div>}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Right Sidebar: Build Manifest */}
                        <div className="lg:col-span-3 space-y-4">
                            <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-4">
                                <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Build Manifest</h3>
                                <div className="space-y-2 text-xs">
                                    <StatusItem done={editorState.syntaxFixed} label="No Syntax Errors" />
                                    <StatusItem done={buildState.compiled} label="Machine Code Ready" />
                                    <StatusItem done={buildState.linked} label="Libraries Linked" />
                                    <StatusItem done={buildState.loaded} label="Resident in RAM" />
                                </div>
                            </div>

                            <div className="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-xl p-4 shadow-lg text-white">
                                <h4 className="font-bold text-sm mb-2 flex items-center gap-2">
                                    <Icon name="sparkles" size={16}/> Why AI in IDEs?
                                </h4>
                                <p className="text-[10px] leading-relaxed opacity-90">
                                    Modern IDEs use Large Language Models to provide context-aware suggestions and help developers understand complex codebases instantly.
                                </p>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const ToolButton = ({ active, onClick, icon, label, disabled = false }) => (
            <button
                onClick={onClick}
                disabled={disabled || active}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg border text-xs font-medium transition-all ${
                    active 
                    ? 'bg-green-600/20 border-green-500 text-green-400 cursor-default shadow-sm' 
                    : disabled
                    ? 'bg-slate-800/30 border-slate-700/50 text-slate-600 cursor-not-allowed opacity-50'
                    : 'bg-slate-700/50 border-slate-600 text-slate-300 hover:bg-slate-600 hover:text-white hover:border-blue-500'
                }`}
            >
                <Icon name={icon} size={16} className={active ? 'text-green-500' : 'text-slate-400'} />
                {label}
                {active && <Icon name="check-circle-2" size={12} className="ml-auto" />}
            </button>
        );

        const StatusItem = ({ done, label }) => (
            <div className="flex items-center gap-2">
                <div className={`w-2 h-2 rounded-full transition-all ${done ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' : 'bg-slate-700'}`} />
                <span className={done ? 'text-slate-200' : 'text-slate-500'}>{label}</span>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
