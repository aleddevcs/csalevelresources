<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starter: Data Structures Retrieval Quiz</title>
<style>
  :root{
    --navy:#1B2A4A; --navy-dark:#121D33; --amber:#D9A441; --amber-light:#F3DDAE;
    --offwhite:#F5F6F8; --white:#FFFFFF; --ink:#1F2733; --muted:#5B6472; --line:#E1E4EA;
    --green:#3E8E5A; --green-light:#DCEFE1; --danger:#B23A3A; --danger-light:#F7D9D9;
    --head-font:Cambria, Georgia, 'Times New Roman', serif;
    --body-font:Calibri, 'Segoe UI', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--body-font); color:var(--ink); background:transparent;}
  .app{max-width:820px; margin:0 auto;}

  header.top{background:var(--navy); border-radius:14px; padding:20px 26px; margin-bottom:18px; position:relative; overflow:hidden;}
  header.top::after{content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:rgba(217,164,65,0.12);}
  header.top .eyebrow{color:var(--amber); font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin:0 0 6px 0;}
  header.top h1{font-family:var(--head-font); color:var(--white); font-size:23px; margin:0 0 6px 0;}
  header.top p{color:var(--amber-light); font-size:13.5px; margin:0; font-style:italic; max-width:640px;}

  .progress-wrap{background:var(--white); border:1px solid var(--line); border-radius:10px; padding:10px 16px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between;}
  .progress-wrap .ptext{font-size:13px; font-weight:700; color:var(--navy);}
  .progress-bar{flex:1; height:8px; background:var(--offwhite); border-radius:4px; margin:0 14px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--amber); width:0%; transition:width 0.3s;}

  .qcard{background:var(--white); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px;}
  .qcard .qnum{font-size:11px; font-weight:700; color:var(--amber); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;}
  .qcard .qtext{font-family:var(--head-font); font-size:16px; color:var(--navy); margin:0 0 12px 0;}
  .opt{
    display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); border-radius:8px; background:var(--offwhite);
    font-family:var(--body-font); font-size:14px; color:var(--ink); cursor:pointer;
  }
  .opt:hover{background:#eceef2;}
  .opt.correct{background:var(--green-light); border-color:var(--green); font-weight:700;}
  .opt.incorrect{background:var(--danger-light); border-color:var(--danger);}
  .opt:disabled{cursor:default;}
  .explain{
    font-size:13px; color:var(--muted); background:var(--offwhite); border-radius:8px;
    padding:9px 12px; margin-top:6px; display:none;
  }
  .explain.show{display:block;}

  .summary{background:var(--navy); border-radius:12px; padding:22px 26px; text-align:center; display:none;}
  .summary.show{display:block;}
  .summary h2{font-family:var(--head-font); color:var(--amber); font-size:22px; margin:0 0 6px 0;}
  .summary p{color:var(--offwhite); font-size:14px; margin:6px 0 0 0;}
  .summary .scoreline{font-size:34px; font-weight:700; color:var(--white); margin:10px 0;}
  .btn{display:inline-block; padding:10px 20px; border-radius:8px; border:none; background:var(--amber);
       color:var(--navy-dark); font-family:var(--body-font); font-weight:700; font-size:14px; cursor:pointer; margin-top:12px;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <p class="eyebrow">Starter &middot; 5&ndash;8 mins</p>
    <h1>Retrieval Quiz: Stacks, Queues, Hash Tables &amp; Linked Lists</h1>
    <p>Eight quick questions before today's checkpoint. Answer, check the explanation, move on &mdash; no need to write anything down.</p>
  </header>

  <div class="progress-wrap">
    <span class="ptext" id="ptext">Question 1 of 8</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="ptext" id="scoreText">Score: 0</span>
  </div>

  <div id="quizArea"></div>

  <div class="summary" id="summary">
    <h2>Nice work!</h2>
    <div class="scoreline" id="finalScore">0 / 8</div>
    <p id="summaryMsg"></p>
    <button class="btn" id="restartBtn" type="button">Go again</button>
  </div>
</div>

<script>
(function(){

  var questions = [
    {
      q: "What does LIFO stand for, in the context of a stack?",
      opts: ["Last In First Out", "First In Last Out", "Last In Last Out", "First In First Out"],
      correct: 0,
      explain: "A stack is Last In First Out \u2014 the most recently pushed item is the first one popped."
    },
    {
      q: "Which pointer is updated when an item is removed from a queue?",
      opts: ["top", "front", "rear", "index"],
      correct: 1,
      explain: "Dequeue removes from the front of the queue, so the front pointer moves."
    },
    {
      q: "Using the hash function index = key MOD 10, which index does key 27 map to?",
      opts: ["2", "3", "7", "9"],
      correct: 2,
      explain: "27 MOD 10 = 7, since 27 \u00f7 10 leaves a remainder of 7."
    },
    {
      q: "Which collision-resolution method stores colliding items in a linked list at that index?",
      opts: ["Linear probing", "Separate chaining", "Direct access", "Load balancing"],
      correct: 1,
      explain: "Separate chaining attaches a linked list of colliding items to the occupied index."
    },
    {
      q: "Besides its data, what does every linked list node contain?",
      opts: ["An index", "A pointer to the next node", "A hash key", "A duplicate copy of the data"],
      correct: 1,
      explain: "Each node holds its data plus a pointer to the next node in the list."
    },
    {
      q: "What is stored in the pointer of the last node in a linked list?",
      opts: ["The address of the head node", "Null", "The first item's data", "Its own address"],
      correct: 1,
      explain: "The last node's pointer is set to null, marking the end of the list."
    },
    {
      q: "What is the term for removing the top item from a stack?",
      opts: ["Enqueue", "Dequeue", "Push", "Pop"],
      correct: 3,
      explain: "Pop removes and returns the top item of a stack. Push adds one."
    },
    {
      q: "What is the main advantage of a hash table over a simple array search?",
      opts: [
        "It keeps data sorted automatically",
        "It gives fast, direct access to data via its key",
        "It never has collisions",
        "It uses less memory than any other structure"
      ],
      correct: 1,
      explain: "A hash function calculates the index directly, avoiding the need to search sequentially."
    }
  ];

  var current = 0;
  var score = 0;
  var answered = false;

  var elQuiz = document.getElementById('quizArea');
  var elPtext = document.getElementById('ptext');
  var elProgress = document.getElementById('progressFill');
  var elScore = document.getElementById('scoreText');
  var elSummary = document.getElementById('summary');
  var elFinalScore = document.getElementById('finalScore');
  var elSummaryMsg = document.getElementById('summaryMsg');
  var elRestart = document.getElementById('restartBtn');

  function renderQuestion(){
    answered = false;
    var q = questions[current];
    elPtext.textContent = 'Question ' + (current+1) + ' of ' + questions.length;
    elProgress.style.width = ((current) / questions.length * 100) + '%';
    elScore.textContent = 'Score: ' + score;

    var card = document.createElement('div');
    card.className = 'qcard';

    var num = document.createElement('div');
    num.className = 'qnum';
    num.textContent = 'Question ' + (current+1);
    card.appendChild(num);

    var qt = document.createElement('p');
    qt.className = 'qtext';
    qt.textContent = q.q;
    card.appendChild(qt);

    var explainBox = document.createElement('div');
    explainBox.className = 'explain';
    explainBox.textContent = q.explain;

    q.opts.forEach(function(optText, idx){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt';
      btn.textContent = optText;
      btn.addEventListener('click', function(){
        if (answered) return;
        answered = true;
        var allOpts = card.querySelectorAll('.opt');
        allOpts.forEach(function(o){ o.disabled = true; });
        if (idx === q.correct){
          btn.classList.add('correct');
          score++;
        } else {
          btn.classList.add('incorrect');
          allOpts[q.correct].classList.add('correct');
        }
        explainBox.classList.add('show');
        elScore.textContent = 'Score: ' + score;

        setTimeout(function(){
          current++;
          if (current < questions.length){
            renderQuestion();
          } else {
            elProgress.style.width = '100%';
            showSummary();
          }
        }, 1400);
      });
      card.appendChild(btn);
    });

    card.appendChild(explainBox);
    elQuiz.innerHTML = '';
    elQuiz.appendChild(card);
  }

  function showSummary(){
    elQuiz.innerHTML = '';
    elSummary.classList.add('show');
    elFinalScore.textContent = score + ' / ' + questions.length;
    var msg;
    if (score === questions.length) msg = "Full marks \u2014 you're ready for the checkpoint.";
    else if (score >= questions.length - 2) msg = "Strong recall. Flag any question you got wrong before we start.";
    else msg = "A few gaps to flag now \u2014 ask before the timed checkpoint begins, not during it.";
    elSummaryMsg.textContent = msg;
  }

  elRestart.addEventListener('click', function(){
    current = 0; score = 0;
    elSummary.classList.remove('show');
    renderQuestion();
  });

  renderQuestion();

})();
</script>
</body>
</html>
