<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth Race</title>
<style>
:root{
  --navy:#003366; --amber:#CC9900; --amberText:#8A6700;
  --bg:#FFFFFF; --panel:#EEF3F8; --ink:#1F2A36; --muted:#5B6B7B; --line:#C8D4E1; --code:#F3F6FA;
  --head:#003366; --soft:#FBF3DD; --grid:#E3E8EE;
  --ok:#1E7B4A; --okBg:#E3F3EA; --bad:#B03A3A; --badBg:#F9E6E6;
  --cA:#1E7B4A; --cB:#5B8DB8; --cC:#003366; --cD:#CC9900; --cE:#B03A3A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#9CC2E8; --amberText:#E8C052; --bg:#0D1824; --panel:#15263A; --ink:#E4ECF4; --muted:#9FB1C4;
    --line:#2B4159; --code:#112030; --head:#001F3F; --soft:#33290E; --grid:#1F3247;
    --ok:#6FD19B; --okBg:#143324; --bad:#F29A9A; --badBg:#3A1C1C;
    --cA:#6FD19B; --cB:#8FB7DD; --cC:#C9D6E3; --cD:#E8C052; --cE:#F29A9A;
  }
}
:root[data-theme="dark"]{
  --navy:#9CC2E8; --amberText:#E8C052; --bg:#0D1824; --panel:#15263A; --ink:#E4ECF4; --muted:#9FB1C4;
  --line:#2B4159; --code:#112030; --head:#001F3F; --soft:#33290E; --grid:#1F3247;
  --ok:#6FD19B; --okBg:#143324; --bad:#F29A9A; --badBg:#3A1C1C;
  --cA:#6FD19B; --cB:#8FB7DD; --cC:#C9D6E3; --cD:#E8C052; --cE:#F29A9A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,"Segoe UI",Carlito,Arial,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3{font-family:Cambria,Caladea,Georgia,serif;margin:0}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{background:var(--head);color:#fff;padding:18px 24px 0}
.hrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;max-width:1320px;margin:0 auto}
header h1{font-size:28px}
.spec{font-size:15px;color:#C9D6E3}
nav{display:flex;gap:4px;max-width:1320px;margin:14px auto 0;overflow-x:auto}
nav button{background:transparent;color:#C9D6E3;border:0;border-radius:10px 10px 0 0;padding:10px 16px;font-size:17px;font-weight:700;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--bg);color:var(--navy)}
nav .n{display:inline-block;width:22px;height:22px;border-radius:50%;background:#CC9900;color:#1F2A36;font-size:13px;line-height:22px;text-align:center;margin-right:6px}
main{max-width:1320px;margin:0 auto;padding:18px 24px 40px}
.top h2{font-size:24px;color:var(--navy)}
.prompt{background:var(--soft);border-radius:10px;padding:10px 16px;margin:10px 0 14px}
.prompt b{color:var(--amberText)}
.algs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:1000px){.algs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.alg{background:var(--panel);border-radius:12px;padding:10px;border-top:6px solid var(--c)}
.alg h3{font-size:18px;color:var(--c);display:flex;justify-content:space-between;align-items:center;gap:6px}
.alg h3 label{font-family:Calibri,Arial,sans-serif;font-size:13px;color:var(--muted);font-weight:400;display:flex;gap:4px;align-items:center}
.alg pre{margin:6px 0 0;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:"Courier New",monospace;font-size:12.5px;white-space:pre;overflow-x:auto;color:var(--ink);min-height:96px}
.alg .ops{margin-top:8px;font-family:Cambria,Georgia,serif;font-size:26px;font-weight:700;color:var(--c);line-height:1.1;word-break:break-all}
.alg .ops small{display:block;font-family:Calibri,Arial,sans-serif;font-size:12px;color:var(--muted);font-weight:400}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.controls input[type=range]{width:360px;max-width:100%;accent-color:#CC9900}
.bign{font-family:Cambria,Georgia,serif;font-size:30px;font-weight:700;color:var(--navy);min-width:70px}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:16px}
.btn.primary{background:#003366;color:#fff}
.btn.accent{background:#CC9900;color:#1F2A36}
.btn.ghost{background:var(--bg);color:var(--navy);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);border-radius:12px;padding:14px}
.panel h3{font-size:18px;color:var(--navy);margin-bottom:8px}
.graph svg{display:block;width:100%;height:auto;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.axis{stroke:var(--ink);stroke-width:2}
.gridl{stroke:var(--grid);stroke-width:1}
.alab{fill:var(--ink);font:700 14px Calibri,Arial,sans-serif}
.tlab{fill:var(--muted);font:12px Calibri,Arial,sans-serif}
.small{font-size:14px;color:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-size:16px}
table.t th{background:#003366;color:#fff;text-align:left;padding:7px 9px}
table.t td{border-bottom:1px solid var(--line);padding:7px 9px;background:var(--bg)}
table.t td.alg-name{font-family:Cambria,Georgia,serif;font-weight:700}
.ratio{font-family:Cambria,Georgia,serif;font-weight:700;font-size:20px}
.fb{margin-top:12px;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--bg)}
.fb.ok{border-color:var(--ok);background:var(--okBg)}
.fb.bad{border-color:var(--bad);background:var(--badBg)}
.disc{margin-top:12px;background:var(--okBg);border-radius:10px;padding:10px 14px}
.disc h3{color:var(--ok);font-size:16px;margin-bottom:4px}
.disc ul{margin:0;padding-left:20px}
.lane{display:grid;grid-template-columns:150px 1fr 190px;gap:10px;align-items:center;margin:8px 0}
.track{height:30px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.fill{height:100%;transition:width .2s linear}
.lname{font-family:Cambria,Georgia,serif;font-weight:700}
.ltime{font-weight:700;text-align:right}
.preds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:8px 0}
@media (max-width:800px){.preds{grid-template-columns:repeat(2,1fr)}}
.pred{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-weight:700}
.pred input{width:20px;height:20px;accent-color:#CC9900}
.pred.ok{border-color:var(--ok);background:var(--okBg)}
.pred.bad{border-color:var(--bad);background:var(--badBg)}
.match{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.mrow.ok{border-color:var(--ok);background:var(--okBg)}
.mrow.bad{border-color:var(--bad);background:var(--badBg)}
.mrow select{border:2px solid #CC9900;border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--ink);width:100%}
.reveal{font-family:"Courier New",monospace;font-weight:700;font-size:18px}
@media (max-width:700px){.mrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div><h1>Growth Race</h1><div class="spec">Unit 3 · 3.10.1 · Method first: how does the work grow as n grows?</div></div>
  </div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<script>
function h(tag,attrs={},...kids){const n=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')n.className=v;else if(k==='style')n.setAttribute('style',v);else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v===true?'':v);}kids.flat().forEach(c=>{if(c==null||c===false)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c);});return n;}
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}

const ALGS=[
 {k:'A',c:'--cA',code:'output items[0]',f:n=>1,big:'O(1)',name:'Constant',dbl:'stays the same'},
 {k:'B',c:'--cB',code:'set x = n\nwhile x > 1\n    set x = x DIV 2\nend while',f:n=>n<2?0:Math.floor(Math.log2(n)),big:'O(log n)',name:'Logarithmic',dbl:'goes up by just 1'},
 {k:'C',c:'--cC',code:'for i = 1 to n\n    output i\nnext i',f:n=>n,big:'O(n)',name:'Linear',dbl:'doubles (× 2)'},
 {k:'D',c:'--cD',code:'for i = 1 to n\n    for j = 1 to n\n        output i * j\n    next j\nnext i',f:n=>n*n,big:'O(n²)',name:'Quadratic',dbl:'quadruples (× 4)'},
 {k:'E',c:'--cE',code:'for i = 1 to n\n  for j = 1 to n\n    for k = 1 to n\n      output i*j*k\n    next k\n  next j\nnext i',f:n=>n*n*n,big:'O(n³)',name:'Cubic',dbl:'goes up 8 times (× 8)'},
];
const col=a=>`var(${a.c})`;
const fmt=x=>x>=1e15?x.toExponential(2).replace('e+',' × 10^'):Math.round(x).toLocaleString('en-GB');
function timeStr(ops){const s=ops/1e9;
  if(s<1e-6)return `${(s*1e9).toFixed(0)} nanoseconds`;if(s<1e-3)return `${(s*1e6).toFixed(1)} microseconds`;if(s<1)return `${(s*1e3).toFixed(1)} milliseconds`;
  if(s<60)return `${s.toFixed(1)} seconds`;if(s<3600)return `${(s/60).toFixed(1)} minutes`;if(s<86400)return `${(s/3600).toFixed(1)} hours`;if(s<31557600)return `${(s/86400).toFixed(1)} days`;
  return `${fmt(s/31557600)} years`;}
const S={tab:0,n:20,show:{A:true,B:true,C:true,D:true,E:false},dn:8,pred:{},predChecked:false,race:null,match:{},matchChecked:false};

/* ---------- graph ---------- */
function graph(N){
  const W=760,Hh=360,L=70,Bm=44,T=16,R=20;
  const vis=ALGS.filter(a=>S.show[a.k]);const maxY=Math.max(1,...vis.map(a=>a.f(N)));
  const svg=el('svg',{viewBox:`0 0 ${W} ${Hh}`,role:'img','aria-label':'Graph of operations against n'});
  const px=n=>L+(n-1)/(Math.max(2,N)-1)*(W-L-R), py=v=>Hh-Bm-(v/maxY)*(Hh-Bm-T);
  for(let i=0;i<=4;i++){const v=maxY*i/4,y=py(v);el('line',{x1:L,x2:W-R,y1:y,y2:y,class:'gridl'},svg);el('text',{x:L-8,y:y+4,'text-anchor':'end',class:'tlab'},svg).textContent=fmt(v);}
  el('line',{x1:L,y1:T,x2:L,y2:Hh-Bm,class:'axis'},svg);el('line',{x1:L,y1:Hh-Bm,x2:W-R,y2:Hh-Bm,class:'axis'},svg);
  el('text',{x:(L+W-R)/2,y:Hh-8,'text-anchor':'middle',class:'alab'},svg).textContent='Size of data (n)';
  const yl=el('text',{x:16,y:(T+Hh-Bm)/2,'text-anchor':'middle',class:'alab',transform:`rotate(-90 16 ${(T+Hh-Bm)/2})`},svg);yl.textContent='Operations (time to complete)';
  [1,Math.round(N/2),N].forEach(n=>{el('text',{x:px(n),y:Hh-Bm+18,'text-anchor':'middle',class:'tlab'},svg).textContent=String(n);});
  vis.forEach(a=>{const pts=[];for(let n=1;n<=N;n++)pts.push(`${px(n)},${py(a.f(n))}`);
    el('polyline',{points:pts.join(' '),fill:'none',stroke:col(a),'stroke-width':4,'stroke-linejoin':'round'},svg);
    el('text',{x:Math.min(W-R-4,px(N)-4),y:Math.max(T+12,py(a.f(N))-8),'text-anchor':'end',fill:col(a),style:'font:700 16px Cambria,Georgia,serif'},svg).textContent=a.k;});
  return h('div',{class:'graph'},svg);
}
function algCards(N,withToggle){
  return h('div',{class:'algs'},...ALGS.map(a=>h('div',{class:'alg',style:`--c:${col(a)}`},
    h('h3',{},`Algorithm ${a.k}`,withToggle?h('label',{},h('input',{type:'checkbox',checked:S.show[a.k]||null,onchange:e=>{S.show[a.k]=e.target.checked;render();}}),'graph'):null),
    h('pre',{},a.code),h('div',{class:'ops'},fmt(a.f(N)),h('small',{},`operations when n = ${N.toLocaleString('en-GB')}`)))));
}

/* ---------- tabs ---------- */
function explore(){
  const sl=h('input',{type:'range',min:'1',max:'100',value:String(S.n),'aria-label':'n'});
  const big=h('span',{class:'bign'},String(S.n));
  const dyn=h('div',{});
  const fill=()=>{big.textContent=String(S.n);sl.value=String(S.n);dyn.replaceChildren(algCards(S.n,true),h('div',{class:'panel'},h('h3',{},'Operations as n grows'),graph(S.n)));};
  sl.addEventListener('input',()=>{S.n=Number(sl.value);fill();});
  fill();
  return h('div',{},
    h('div',{class:'top'},h('h2',{},'Explore: slide n up')),
    h('div',{class:'prompt'},h('b',{},'Task: '),'Each algorithm does some work on a list of n items. The number shows how many times its innermost line runs. Slide n up slowly and watch the counts and the graph. Untick algorithms to zoom in on the others: E grows so fast it squashes the rest.'),
    h('div',{class:'controls'},h('b',{},'n ='),sl,big,
      ...[5,10,50,100].map(v=>h('button',{class:'btn ghost',onclick:()=>{S.n=v;fill();}},`n = ${v}`))),
    dyn,
    h('div',{class:'disc'},h('h3',{},'Talk about it'),h('ul',{},
      h('li',{},'Which algorithm\'s count never changes?'),h('li',{},'Which one hardly grows at all, even when n gets big?'),
      h('li',{},'Which ones curve upwards? Which curves upwards fastest?'),h('li',{},'Which line is perfectly straight? Why?'))));
}
function doubling(){
  const n=S.dn;
  const rows=ALGS.map(a=>{const x=a.f(n),y=a.f(2*n);const r=x===0?'–':(y/x);
    return h('tr',{},h('td',{class:'alg-name',style:`color:${col(a)}`},`Algorithm ${a.k}`),h('td',{},fmt(x)),h('td',{},fmt(y)),
      h('td',{class:'ratio',style:`color:${col(a)}`},a.k==='B'?`+${y-x}`:`× ${Number.isInteger(r)?r:r.toFixed(1)}`));});
  return h('div',{},
    h('div',{class:'top'},h('h2',{},'Double it: what happens when n doubles?')),
    h('div',{class:'prompt'},h('b',{},'Task: '),'Pick a size, then double it. Look at the last column: it is the same for every starting size. That pattern is what tells the algorithms apart.'),
    h('div',{class:'controls'},h('b',{},'Start with n ='),...[4,8,16,32,64,500,1000].map(v=>h('button',{class:v===n?'btn primary':'btn ghost',onclick:()=>{S.dn=v;render();}},String(v)))),
    h('div',{class:'panel'},h('table',{class:'t'},h('thead',{},h('tr',{},h('th',{},'Algorithm'),h('th',{},`n = ${n.toLocaleString('en-GB')}`),h('th',{},`n = ${(2*n).toLocaleString('en-GB')}`),h('th',{},'What happened?'))),h('tbody',{},...rows))),
    h('div',{class:'disc'},h('h3',{},'Spot the patterns'),h('ul',{},
      h('li',{},'A does not change at all.'),h('li',{},'B only goes up by 1 each time n doubles. Halving is very powerful!'),
      h('li',{},'C doubles: twice the data, twice the work.'),h('li',{},'D goes up 4 times, and E goes up 8 times. Why 4 and 8? (Hint: 2 × 2 and 2 × 2 × 2.)'))));
}
function race(){
  const N=1000000;const ops=ALGS.map(a=>a.f(N));
  const preds=h('div',{class:'preds'},...ALGS.map(a=>{const fast=a.f(N)/1e9<1;let cls='pred';if(S.predChecked)cls+=(!!S.pred[a.k]===fast)?' ok':' bad';
    const cb=h('input',{type:'checkbox',checked:S.pred[a.k]||null,disabled:S.predChecked||null});cb.addEventListener('change',()=>{S.pred[a.k]=cb.checked;});
    return h('label',{class:cls,style:`color:${col(a)}`},cb,`Algorithm ${a.k}`);}));
  const go=()=>{S.predChecked=true;S.race={t:0};const tick=()=>{if(!S.race)return;S.race.t=Math.min(1,S.race.t+0.025);render();if(S.race.t<1)setTimeout(tick,40);};tick();};
  const L=ops.map(o=>Math.log10(Math.max(1,o)+1)),Lmax=Math.max(...L);
  const lanes=S.race?h('div',{class:'panel',style:'margin-top:12px'},h('h3',{},'Time to run with n = 1,000,000 on a computer doing 1 billion operations per second'),
    ...ALGS.map((a,i)=>h('div',{class:'lane'},h('span',{class:'lname',style:`color:${col(a)}`},`Algorithm ${a.k}`),
      h('div',{class:'track'},h('div',{class:'fill',style:`width:${Math.max(1,L[i]/Lmax*100*S.race.t)}%;background:${col(a)}`})),
      h('span',{class:'ltime'},S.race.t>=1?timeStr(ops[i]):'…'))),
    h('p',{class:'small',style:'margin:6px 0 0'},'The bars use a log scale: each extra bar length means about 10 times longer. On a normal scale, A, B and C would be invisible next to E.')):null;
  return h('div',{},
    h('div',{class:'top'},h('h2',{},'Race to a million')),
    h('div',{class:'prompt'},h('b',{},'Task: '),'A real data set might have 1,000,000 items. Before you race, PREDICT: which algorithms will finish in under one second on a computer doing 1 billion operations per second?'),
    h('div',{class:'panel'},h('h3',{},'Tick the ones you think finish in under a second'),preds,
      h('button',{class:'btn accent',onclick:go,disabled:S.predChecked||null},'Lock in predictions and race!'),
      S.predChecked?h('button',{class:'btn ghost',style:'margin-left:8px',onclick:()=>{S.pred={};S.predChecked=false;S.race=null;render();}},'Try again'):null),
    lanes,
    S.race&&S.race.t>=1?h('div',{class:'disc'},h('h3',{},'So what?'),h('ul',{},
      h('li',{},'A, B and C finish almost instantly. D takes about 17 minutes, and E takes about 32 years.'),
      h('li',{},'The code for D and E is only a few lines long. Short code is not the same as fast code.'),
      h('li',{},'For big data, the way the work GROWS matters far more than how fast the computer is.'))):null);
}
const DESCS=['stays the same','goes up by just 1','doubles (× 2)','quadruples (× 4)','goes up 8 times (× 8)'];
function nameIt(){
  const M=S.match;
  const rows=ALGS.map(a=>{const s=h('select',{'aria-label':`Algorithm ${a.k}`,disabled:S.matchChecked||null},h('option',{value:''},'When n doubles, the work…'),...DESCS.map(d=>{const o=h('option',{value:d},d);if(M[a.k]===d)o.selected=true;return o;}));
    s.addEventListener('change',()=>{M[a.k]=s.value;});
    let cls='mrow';if(S.matchChecked)cls+=M[a.k]===a.dbl?' ok':' bad';
    return h('div',{class:cls},h('span',{class:'lname',style:`color:${col(a)}`},`Algorithm ${a.k}`),s,
      S.matchChecked?h('span',{class:'reveal',style:`color:${col(a)}`},`${a.big}  ${a.name}`):h('span',{class:'small'},'?'));});
  const right=ALGS.filter(a=>M[a.k]===a.dbl).length;
  return h('div',{},
    h('div',{class:'top'},h('h2',{},'Name the patterns')),
    h('div',{class:'prompt'},h('b',{},'Task: '),'Match each algorithm to what happens to its work when n doubles. Then check, and find out the official names for these patterns.'),
    h('div',{class:'panel'},h('div',{class:'match'},...rows),
      h('div',{style:'margin-top:12px;display:flex;gap:10px'},h('button',{class:'btn primary',disabled:S.matchChecked||null,onclick:()=>{S.matchChecked=true;render();}},'Check and reveal the names'),
        S.matchChecked?h('button',{class:'btn ghost',onclick:()=>{S.match={};S.matchChecked=false;render();}},'Try again'):null)),
    S.matchChecked?h('div',{class:'fb '+(right===5?'ok':'bad')},h('b',{},`${right} of 5 correct. `),
      'These patterns have names. Big O notation describes how the work an algorithm does GROWS as the size of its input, n, gets large: O(1), O(log n), O(n), O(n²) and O(n³). You will meet O(n log n), O(2ⁿ) and O(n!) next.'):null);
}
const TABS=[['Explore',explore],['Double it',doubling],['Race to a million',race],['Name the patterns',nameIt]];
function render(){
  const nav=document.getElementById('tabs');nav.innerHTML='';
  TABS.forEach(([t],i)=>nav.appendChild(h('button',{role:'tab','aria-selected':String(i===S.tab),onclick:()=>{S.tab=i;render();}},h('span',{class:'n'},String(i+1)),t)));
  const main=document.getElementById('main');main.innerHTML='';main.appendChild(TABS[S.tab][1]());
}
render();
</script>
</body>
</html>
