<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search Lab</title>
<style>
:root{
  --navy:#003366; --amber:#CC9900; --amberText:#8A6700;
  --bg:#FFFFFF; --panel:#EEF3F8; --ink:#1F2A36; --muted:#5B6B7B; --line:#C8D4E1; --code:#F3F6FA;
  --head:#003366; --soft:#FBF3DD; --cell:#FFFFFF; --stroke:#003366; --grey:#E3E8EE;
  --ok:#1E7B4A; --okBg:#E3F3EA; --bad:#B03A3A; --badBg:#F9E6E6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#9CC2E8; --amberText:#E8C052; --bg:#0D1824; --panel:#15263A; --ink:#E4ECF4; --muted:#9FB1C4;
    --line:#2B4159; --code:#112030; --head:#001F3F; --soft:#33290E; --cell:#0D1824; --stroke:#9CC2E8; --grey:#1C2B3C;
    --ok:#6FD19B; --okBg:#143324; --bad:#F29A9A; --badBg:#3A1C1C;
  }
}
:root[data-theme="dark"]{
  --navy:#9CC2E8; --amberText:#E8C052; --bg:#0D1824; --panel:#15263A; --ink:#E4ECF4; --muted:#9FB1C4;
  --line:#2B4159; --code:#112030; --head:#001F3F; --soft:#33290E; --cell:#0D1824; --stroke:#9CC2E8; --grey:#1C2B3C;
  --ok:#6FD19B; --okBg:#143324; --bad:#F29A9A; --badBg:#3A1C1C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,"Segoe UI",Carlito,Arial,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3{font-family:Cambria,Caladea,Georgia,serif;margin:0}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{background:var(--head);color:#fff;padding:18px 24px 0}
.hrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;max-width:1340px;margin:0 auto}
header h1{font-size:28px}
.spec{font-size:15px;color:#C9D6E3}
nav{display:flex;gap:4px;max-width:1340px;margin:14px auto 0;overflow-x:auto}
nav button{background:transparent;color:#C9D6E3;border:0;border-radius:10px 10px 0 0;padding:10px 16px;font-size:17px;font-weight:700;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--bg);color:var(--navy)}
nav .n{display:inline-block;width:22px;height:22px;border-radius:50%;background:#CC9900;color:#1F2A36;font-size:13px;line-height:22px;text-align:center;margin-right:6px}
main{max-width:1340px;margin:0 auto;padding:18px 24px 40px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.top h2{font-size:24px;color:var(--navy)}
.prompt{background:var(--soft);border-radius:10px;padding:10px 16px;margin-bottom:14px}
.prompt b{color:var(--amberText)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.controls label{font-size:15px;color:var(--muted);display:flex;gap:6px;align-items:center}
.controls select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--ink)}
.stats{display:flex;gap:18px;margin-left:auto}
.stat{font-size:13px;color:var(--muted);text-align:right}
.stat b{display:block;font-size:24px;line-height:1.1;color:var(--navy);font-family:Cambria,Georgia,serif}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--navy);padding:7px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:#003366;color:#fff}
.btn{border:0;border-radius:8px;padding:9px 18px;font-weight:700;font-size:16px}
.btn.primary{background:#003366;color:#fff}
.btn.accent{background:#CC9900;color:#1F2A36}
.btn.ghost{background:var(--bg);color:var(--navy);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.panel{background:var(--panel);border-radius:12px;padding:14px}
.panel h3{font-size:18px;color:var(--navy);margin-bottom:10px}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.fb{margin-top:12px;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--bg)}
.fb.ok{border-color:var(--ok);background:var(--okBg)}
.fb.bad{border-color:var(--bad);background:var(--badBg)}
.small{font-size:14px;color:var(--muted)}

/* array */
.arrwrap{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-x:auto}
.arr{display:flex;justify-content:center;gap:6px;min-width:560px}
.slot{display:flex;flex-direction:column;align-items:center;width:62px}
.mk{height:34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:12px;font-weight:700;line-height:1.1}
.mk.lo{color:var(--amberText)}
.mk.hi{color:var(--navy);justify-content:flex-start}
.cell{width:62px;height:62px;border:2px solid var(--stroke);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:Cambria,Georgia,serif;font-size:24px;font-weight:700;background:var(--cell);color:var(--ink);position:relative}
.cell.out{background:var(--grey);color:var(--muted);border-color:var(--line)}
.cell.pivot{box-shadow:inset 0 0 0 4px #CC9900}
.cell.test{background:#F3DFA0;color:#1F2A36}
.cell.swap{background:#CC9900;color:#1F2A36}
.cell.final{background:#003366;color:#fff;border-color:#003366}
.cell.pick{cursor:pointer}
.cell.pick:hover{outline:3px solid #CC9900}
.cell.right{outline:3px solid var(--ok)}
.cell.wrong{outline:3px solid var(--bad)}
.ix{font-size:12px;color:var(--muted);margin-top:2px}
.rangebar{display:flex;justify-content:center;gap:6px;min-width:560px;margin-top:2px}
.rangebar span{width:62px;height:5px;border-radius:3px}
.rangebar span.on{background:#CC9900}
.vars{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.var{border:2px solid var(--line);border-radius:8px;padding:3px 10px;font-family:"Courier New",monospace;font-weight:700;background:var(--bg)}
.var.pv{border-color:#CC9900}
.now{background:var(--bg);border:2px solid var(--amber);border-radius:10px;padding:10px 12px;margin-top:12px;min-height:80px}
.now .ev{font-size:13px;font-weight:700;color:var(--amberText)}
.now p{margin:2px 0 0}
.ask{background:var(--soft);border:2px dashed #CC9900;border-radius:10px;padding:10px 12px;margin-top:12px}
.ask b{color:var(--amberText)}
.ask .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.code{list-style:none;margin:0;padding:8px 0;background:var(--code);border:1px solid var(--line);border-radius:8px;counter-reset:ln;overflow-x:auto}
.code li{counter-increment:ln;padding:1px 10px 1px 6px;font-family:"Courier New",monospace;font-size:12px;white-space:pre;display:flex}
.code li::before{content:counter(ln);width:22px;flex:none;color:var(--muted);font-size:11px;padding-top:1px}
.code li.cur{background:var(--soft);font-weight:700;outline:2px solid var(--amber);outline-offset:-2px;border-radius:4px}

/* stack + tree */
.stack{display:flex;flex-direction:column-reverse;gap:5px;min-height:120px;padding:8px;border:2px solid var(--stroke);border-top:0;border-radius:0 0 10px 10px;background:var(--bg)}
.frame{border:2px solid var(--stroke);border-radius:8px;padding:5px 8px;background:var(--bg);font-size:14px}
.frame b{font-family:"Courier New",monospace;color:var(--navy)}
.frame.active{border-color:#CC9900;border-width:3px}
.frame.base{background:#CC9900;border-color:#CC9900;color:#1F2A36}
.frame.base b{color:#1F2A36}
.frame.waiting{opacity:.8}
.tree{display:flex;justify-content:center;overflow-x:auto;padding:6px 0}
.tn{display:flex;flex-direction:column;align-items:center}
.tbox{border:2px solid var(--stroke);border-radius:8px;padding:4px 8px;font-family:"Courier New",monospace;font-size:13px;font-weight:700;background:var(--bg);white-space:nowrap;text-align:center;color:var(--ink)}
.tbox small{display:block;font-family:Calibri,Arial,sans-serif;font-weight:400;font-size:11px;color:var(--muted)}
.tbox.onstack{border-color:#CC9900;border-width:3px}
.tbox.cur{background:#CC9900;color:#1F2A36;border-color:#CC9900}
.tbox.cur small{color:#1F2A36}
.tbox.done{background:#003366;color:#fff;border-color:#003366}
.tbox.done small{color:#C9D6E3}
.tbox.base{background:#F3DFA0;color:#1F2A36;border-color:#CC9900}
.tbox.base small{color:#5B4A10}
.tbox.none{border-style:dashed;border-color:var(--line);color:var(--muted);font-family:Calibri,Arial,sans-serif;font-weight:400}
.kids{display:flex;gap:10px;margin-top:14px;position:relative;align-items:flex-start}
.kid{display:flex;flex-direction:column;align-items:center;position:relative}
.kid::before{content:"";position:absolute;top:-14px;left:50%;height:14px;border-left:2px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:8px}
.sw{display:inline-block;width:14px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:2px solid var(--stroke)}

/* concept tab */
.cnode{border:2px solid var(--line);border-radius:10px;padding:6px;background:var(--bg);display:flex;flex-direction:column;align-items:center}
.cnode.active{border-color:#CC9900;border-width:3px;background:var(--soft)}
.cnode.sorted{border-color:var(--ok)}
.citems{display:flex;gap:4px}
.ci{width:40px;height:40px;border:2px solid var(--stroke);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:Cambria,Georgia,serif;font-weight:700;font-size:18px;background:var(--bg);color:var(--ink)}
.ci.pv{background:#CC9900;color:#1F2A36;border-color:#CC9900}
.ci.cur{outline:3px solid #CC9900;outline-offset:2px}
.ci.pick{cursor:pointer}
.ci.pick:hover{background:var(--soft)}
.ci.done{background:#003366;color:#fff;border-color:#003366}
.ci.dim{opacity:.35}
.cempty{font-family:"Courier New",monospace;color:var(--muted);padding:8px 10px}
.clabel{font-size:11px;color:var(--muted);margin-top:3px}
.ctree{display:flex;justify-content:center;overflow-x:auto;padding:10px 0;min-height:200px}
.final{display:flex;gap:6px;justify-content:center;margin-top:10px}

/* build */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (max-width:900px){.stages{grid-template-columns:1fr 1fr}}
.stg{display:flex;gap:8px;align-items:center;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 8px}
.stg small{color:var(--muted);font-size:12px}
.stg b{font-size:14px}
.stg .sn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--panel);color:var(--navy);font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.stg.cur{border-color:#CC9900;background:var(--soft)}
.stg.done .sn{background:var(--ok);color:#fff}
.stg:disabled{opacity:.5;cursor:not-allowed}
.pgrid{display:grid;grid-template-columns:minmax(0,3.6fr) minmax(0,6.6fr) minmax(0,2.8fr);gap:16px;align-items:start}
@media (max-width:1100px){.pgrid{grid-template-columns:1fr 1fr}.pgrid .meter{grid-column:1 / -1}}
@media (max-width:700px){.pgrid{grid-template-columns:1fr}}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:5px 9px;font-family:"Courier New",monospace;font-size:13px;text-align:left}
.chip:hover:not(:disabled){border-color:var(--navy)}
.chip:disabled{opacity:.35;cursor:default}
.answer{list-style:none;margin:0;padding:0;min-height:50px;background:var(--code);border:1px solid var(--line);border-radius:8px}
.answer li{display:flex;align-items:center;gap:6px;padding:2px 6px;border-bottom:1px solid var(--line)}
.answer li:last-child{border-bottom:0}
.answer li.fixed{background:var(--panel);color:var(--muted)}
.answer .txt{flex:1;font-family:"Courier New",monospace;font-size:12.5px;white-space:pre;overflow-x:auto}
.answer li.ok{background:var(--okBg)}
.answer li.bad{background:var(--badBg)}
.answer li.slotline{background:var(--soft)}
.ctl{display:flex;gap:2px;flex:none}
.ctl button{width:26px;height:26px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font-size:12px;padding:0}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.mlist li{display:flex;gap:8px;align-items:flex-start;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.mlist .bx{flex:none;width:18px;height:18px;border-radius:4px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700}
.mlist li.got{border-color:var(--ok);background:var(--okBg)}
.mlist li.got .bx{background:var(--ok);border-color:var(--ok)}
.mscore{font-family:Cambria,Georgia,serif;font-size:30px;font-weight:700;color:var(--navy)}
.fb ul{margin:4px 0 0;padding-left:20px}

/* flowchart */
.fnode .shape{fill:var(--shape);stroke:var(--stroke);stroke-width:2}
.fnode text{fill:var(--ink);font-family:Calibri,"Segoe UI",Carlito,Arial,sans-serif;font-size:14px;font-weight:700;dominant-baseline:central}
.fnode.blank .shape{stroke-dasharray:6 4}
.fnode.blank text.letter{fill:var(--muted);font-size:16px}
.fnode.placed text{font-family:"Courier New",monospace;font-weight:700;font-size:13px}
.fnode.click{cursor:pointer}
.fnode.click:hover .shape{stroke:var(--amber)}
.fnode.sel .shape{stroke:var(--sel);stroke-width:3.5}
.fnode.ok .shape{stroke:var(--ok);stroke-width:3;fill:var(--okBg)}
.fnode.bad .shape{stroke:var(--bad);stroke-width:3;fill:var(--badBg)}
.fnode.drop .shape{stroke:var(--amber);stroke-width:3.5}
.edge{fill:none;stroke:var(--stroke);stroke-width:1.8}
.elabel{fill:var(--amberText);font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:13px;font-weight:700}
.arrowhead{fill:var(--stroke)}



:root{--shape:var(--bg);--sel:#CC9900}
.cell.midc{box-shadow:inset 0 0 0 4px #CC9900}
.cell.final{background:#1E7B4A;border-color:#1E7B4A;color:#fff}
.mk{height:22px}
.outbox{background:#0F1E2E;color:#E4ECF4;border-radius:8px;padding:8px 12px;font-family:"Courier New",monospace;font-size:15px;margin-top:10px}
.outbox .small{color:#9FB1C4;font-family:Calibri,Arial,sans-serif}
.twrap{overflow-x:auto}
.tt{border-collapse:collapse;width:100%;font-size:15px}
.tt th{background:#003366;color:#fff;padding:5px 8px;text-align:left;white-space:nowrap}
.tt td{border-bottom:1px solid var(--line);padding:4px 8px;font-family:"Courier New",monospace;background:var(--bg);white-space:nowrap}
.numin{width:90px;border:2px solid #CC9900;border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--ink)}
.flowwrap{background:var(--panel);border-radius:12px;padding:10px;overflow-x:auto}
.flowwrap svg{display:block;height:auto;max-width:100%;margin:0 auto}
.opts{display:grid;gap:8px;margin-top:6px}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px}
.opt.mono{font-family:"Courier New",monospace}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt.ok{border-color:var(--ok);background:var(--okBg)}
.opt.bad{border-color:var(--bad);background:var(--badBg)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--muted);font-weight:700}
.dot[aria-current="true"]{border-color:var(--navy);color:var(--navy)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.baddot{background:var(--bad);border-color:var(--bad);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
@media (max-width:950px){.grid2{grid-template-columns:1fr}}
.pre{margin:0;font-family:"Courier New",monospace;font-size:13px;white-space:pre;overflow-x:auto;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);text-align:left}
.cand{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;color:var(--ink)}
.cand:hover:not(:disabled){border-color:var(--navy)}
.cand:disabled{cursor:default}
.cand.ok{border-color:var(--ok);background:var(--okBg)}
.cand.bad{border-color:var(--bad);background:var(--badBg)}
.cl{display:block;font-weight:700;color:var(--navy);margin-bottom:4px}
.lane{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;margin:8px 0}
.lname{font-weight:700;color:var(--navy)}
.ltrack{height:30px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lfill{height:100%}
.lfill.l{background:#003366}
.lfill.b{background:#CC9900}
.lnum{font-family:Cambria,Georgia,serif;font-size:22px;color:var(--navy);text-align:right}
.disc{margin-top:14px;background:var(--okBg);border-radius:10px;padding:10px 14px}
.disc h3{color:var(--ok);font-size:16px;margin-bottom:4px}
.disc ul{margin:0;padding-left:20px}
.stages{grid-template-columns:repeat(6,minmax(0,1fr))}
.ask .row{align-items:center}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div><h1>Search Lab</h1><div class="spec">Unit 3 · 3.5.3 and 3.5.4 · Describe, interpret, alter and write search algorithms</div></div>
    <div class="spec">Keys: <b>→</b> step · <b>←</b> back (Trace It)</div>
  </div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<script>
function h(tag,attrs={},...kids){const n=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')n.className=v;else if(k==='style')n.setAttribute('style',v);else if(k==='html')n.innerHTML=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v===true?'':v);}kids.flat().forEach(c=>{if(c==null||c===false)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c);});return n;}
function seeded(arr,seed){const a=arr.slice();let s=seed;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const sel=(lab,val,opts,on)=>h('label',{},lab,h('select',{onchange:e=>on(e.target.value)},...opts.map(([v,t])=>{const o=h('option',{value:String(v)},t);if(String(v)===String(val))o.selected=true;return o;})));


/* ---------------- flowchart geometry + rendering ---------------- */
const G = {W:200,H:44,DW:280,DH:74,TW:140,TH:40,ROW:78,Y0:40,COL:330};
const NS = 'http://www.w3.org/2000/svg';
function geom(n){
  const t=n.type;
  const w=n.w||(t==='dec'?G.DW:t==='term'?G.TW:G.W), h=n.h||(t==='dec'?G.DH:t==='term'?G.TH:G.H);
  return {cx:(n.col||0)*G.COL, cy:G.Y0+n.row*G.ROW, w, h};
}
function port(g,side){
  if(side==='bottom')return {x:g.cx,y:g.cy+g.h/2};
  if(side==='top')return {x:g.cx,y:g.cy-g.h/2};
  if(side==='right')return {x:g.cx+g.w/2,y:g.cy};
  return {x:g.cx-g.w/2,y:g.cy};
}
function route(e,gf,gt){
  const exit=e.exit||'bottom', enter=e.enter||'top';
  const s=port(gf,exit), t=port(gt,enter), p=[s];
  const lx = e.lane!==undefined ? e.lane : null;
  if(exit==='right'||exit==='left'){
    if(enter==='top'){
      if(lx===null){p.push({x:t.x,y:s.y});}
      else{p.push({x:lx,y:s.y},{x:lx,y:t.y-22},{x:t.x,y:t.y-22});}

function renderFlow(host,spec,opts={}){
  host.innerHTML='';
  const svg=el('svg',{role:'img','aria-label':spec.aria||'Flowchart'});
  const defs=el('defs',{},svg);
  const m=el('marker',{id:'ah'+(renderFlow.n=(renderFlow.n||0)+1),viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 z',class:'arrowhead'},m);
  const mid=m.getAttribute('id');
  const byId={};spec.nodes.forEach(n=>byId[n.id]=n);
  let minX=Infinity,maxX=-Infinity,maxY=0;
  spec.nodes.forEach(n=>{const g=geom(n);minX=Math.min(minX,g.cx-g.w/2);maxX=Math.max(maxX,g.cx+g.w/2);maxY=Math.max(maxY,g.cy+g.h/2);});
  spec.edges.forEach(e=>{if(e.lane!==undefined){minX=Math.min(minX,e.lane-10);maxX=Math.max(maxX,e.lane+10);}});
  const pad=30;
  const vbW=maxX-minX+2*pad;
  svg.setAttribute('viewBox',`${minX-pad} 0 ${vbW} ${maxY+pad}`);
  svg.style.width=Math.round(vbW*1.15)+'px';
  const eg=el('g',{},svg);
  spec.edges.forEach(e=>{
    const gf=geom(byId[e.from]), gt=geom(byId[e.to]);
    const r=route(e,gf,gt);
    el('polyline',{points:r.pts.map(p=>p.x+','+p.y).join(' '),class:'edge','marker-end':`url(#${mid})`},eg);
    const lab = opts.labelFor ? opts.labelFor(e) : e.label;
    if(lab){
      let lx=r.s.x,ly=r.s.y,anchor='start';
      if(r.exit==='bottom'){lx+=8;ly+=15;}
      else if(r.exit==='right'){lx+=8;ly-=8;}
      else {lx-=8;ly-=8;anchor='end';}
      el('text',{x:lx,y:ly,class:'elabel','text-anchor':anchor},eg).textContent=lab;
    }
  });
  spec.nodes.forEach(n=>{
    const g=geom(n);
    const info=opts.textFor?opts.textFor(n):{text:n.text,cls:''};
    const state=opts.stateFor?opts.stateFor(n):'';
    const clickable=opts.clickable?opts.clickable(n):false;
    const grp=el('g',{class:`fnode ${info.cls||''} ${state||''} ${clickable?'click':''}`},svg);
    drawShape(g,n.draw||n.type,grp);
    const max=n.wrap||(n.type==='dec'?22:24);
    const lines=wrap(info.text,max), lh=16;
    lines.forEach((ln,i)=>{
      const t=el('text',{x:g.cx,y:g.cy+(i-(lines.length-1)/2)*lh,'text-anchor':'middle',class:info.textCls||''},grp);
      t.textContent=ln;
    });
    if(clickable){
      grp.setAttribute('tabindex','0');grp.setAttribute('role','button');
      grp.setAttribute('aria-label',info.aria||info.text);
      grp.addEventListener('click',()=>opts.onClick(n));
      grp.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();opts.onClick(n);}});
    }
    if(opts.onDrop && clickable){
      grp.addEventListener('dragover',ev=>{ev.preventDefault();grp.classList.add('drop');});
      grp.addEventListener('dragleave',()=>grp.classList.remove('drop'));

    }
  });

}

 {name:'Compare and narrow',marks:['m6','m7'],head:null,before:['        set midpoint = (first + last) DIV 2'],after:['    end while','End Subroutine'],solutions:[B3],
  prompt:'Compare the middle item with searchItem: found, or move first or last past the midpoint.',
  dis:[['set first = midpoint','The midpoint has already been checked. Without + 1 the search can get stuck and loop forever.'],['set last = midpoint + 1','last must move to just BEFORE the midpoint: midpoint - 1.']]},
 {name:'Output',marks:['m8'],head:null,before:['        end if'],after:['End Subroutine'],solutions:[B4],
  prompt:'End the loop and output the result.',
  dis:[['output "Item found at index ", first','first is the start of the search range, not the position of the item. Output foundIndex.']]},
 {name:'Put it together',marks:MARKS.map(m=>m[0]),extension:true,head:'Declare BinarySearch(items, searchItem)',before:[],after:['End Subroutine'],solutions:[[...B1,...B2,...B3,...B4]],
  prompt:'Extension: build the whole binary search in one go. This is a full answer to WJEC 2022 Q4 [8].',
  dis:[['while first < last AND found = FALSE','The last remaining item would never be checked. Use <=.'],['set first = midpoint','Without + 1 the search can loop forever.'],['set midpoint = (first + last) / 2','Use DIV so the midpoint is a whole number.']]},
];
STAGES.forEach((st,si)=>{const base=st.solutions[0].map(([,t])=>t);st.bank=seeded([...base.map(t=>({text:t})),...st.dis.map(([t,why])=>({text:t,dis:true,why}))],71+si*13);});
function buildInit(){S.build={stage:0,st:STAGES.map(()=>({answer:[],marks:null,fb:null,solved:false,revealed:false})),earned:new Set()};}
buildInit();
function buildView(){
  const B=S.build,si=B.stage,st=STAGES[si],P=B.st[si];
  const unlocked=i=>i<=1||B.st[i-1].solved||B.st[i-1].revealed;
  const used=new Set(P.answer.map(a=>a.b));
  const defInd=si===3?2:1;
  const bank=h('div',{class:'bank'},st.bank.map((it,bi)=>h('button',{class:'chip',disabled:used.has(bi)||null,onclick:()=>{P.answer.push({b:bi,indent:defInd});P.marks=null;P.fb=null;render();}},it.text)));
  const ol=h('ol',{class:'answer'});
  const fixed=t=>h('li',{class:'fixed'},h('span',{class:'txt'},t),h('span',{class:'small'},'given'));
  if(st.head)ol.appendChild(fixed(st.head));st.before.forEach(t=>ol.appendChild(fixed(t)));
  const chg=()=>{P.marks=null;P.fb=null;render();};
  const mv=(j,d)=>{const t=j+d;if(t<0||t>=P.answer.length)return;[P.answer[j],P.answer[t]]=[P.answer[t],P.answer[j]];chg();};
  P.answer.forEach((a,j)=>{const it=st.bank[a.b];
    ol.appendChild(h('li',{class:P.marks?(P.marks[j]?'ok':'bad'):null},h('span',{class:'txt'},'    '.repeat(a.indent)+it.text),
      h('span',{class:'ctl'},h('button',{'aria-label':'Outdent',onclick:()=>{a.indent=Math.max(0,a.indent-1);chg();}},'←'),h('button',{'aria-label':'Indent',onclick:()=>{a.indent=Math.min(5,a.indent+1);chg();}},'→'),
        h('button',{'aria-label':'Move up',onclick:()=>mv(j,-1)},'↑'),h('button',{'aria-label':'Move down',onclick:()=>mv(j,1)},'↓'),h('button',{'aria-label':'Remove',onclick:()=>{P.answer.splice(j,1);chg();}},'×'))));});
  if(!P.answer.length)ol.appendChild(h('li',{class:'slotline'},h('span',{class:'txt',style:'font-family:Calibri,Arial,sans-serif'},'Click lines in the bank to add them here.')));
  st.after.forEach(t=>ol.appendChild(fixed(t)));
  const check=()=>{
    const ans=P.answer.map(a=>({t:st.bank[a.b].text,ind:a.indent,it:st.bank[a.b]}));
    let best=null,bs=-1;st.solutions.forEach(sol=>{let sc=0;ans.forEach((a,j)=>{if(sol[j]&&sol[j][1]===a.t&&sol[j][0]===a.ind)sc++;});if(sc>bs){bs=sc;best=sol;}});
    const items=[];P.marks=ans.map((a,j)=>{const s=best[j];if(s&&s[1]===a.t&&s[0]===a.ind)return true;
      if(a.it.dis)items.push(`"${a.t}": ${a.it.why}`);else if(s&&s[1]===a.t)items.push(`"${a.t}" is in the right place but the indentation is wrong.`);else items.push(`"${a.t}" is in the wrong position.`);return false;});
    if(ans.length<best.length)items.push(`${best.length-ans.length} line(s) still missing.`);
    const ok=bs===best.length&&ans.length===best.length;
    if(ok&&!P.revealed){P.solved=true;st.marks.forEach(m=>B.earned.add(m));}
    P.fb={ok,items,summary:ok?(P.revealed?'Correct, but the answer was revealed. Reset and try from memory to earn the marks.':st.marks.length?`Correct. ${st.marks.length} mark point${st.marks.length>1?'s':''} ticked off.`:'Correct. Now build the binary search.'):`${bs} of ${best.length} lines correct.`};render();};
  const reveal=()=>{P.revealed=true;const u=new Set();P.answer=st.solutions[0].map(([ind,t])=>{const bi=st.bank.findIndex((x,k)=>x.text===t&&!u.has(k));u.add(bi);return {b:bi,indent:ind};});P.marks=null;P.fb={ok:true,items:st.dis.map(([t,w])=>`Not used, "${t}": ${w}`),summary:'Answer revealed. Revealed stages do not earn marks.'};render();};
  const got=MARKS.filter(([k])=>B.earned.has(k)).length;
  const meter=h('div',{class:'panel meter'},h('h3',{},'Mark-scheme meter'),h('div',{style:'display:flex;align-items:baseline;gap:8px;margin-bottom:6px'},h('span',{class:'mscore'},`${got} / 8`)),
    h('p',{class:'small',style:'margin:0 0 8px'},'WJEC 2022 Q4: "Write a Binary Search algorithm to search for a value in an array… and output its position." [8]'),
    h('ul',{class:'mlist'},MARKS.map(([k,t])=>h('li',{class:B.earned.has(k)?'got':null},h('span',{class:'bx'},B.earned.has(k)?'✓':''),t))));
  const bar=h('div',{class:'stages'},STAGES.map((x,i)=>{const S2=B.st[i],lock=!unlocked(i);
    return h('button',{class:'stg'+(i===si?' cur':'')+(S2.solved?' done':''),disabled:lock||null,onclick:()=>{B.stage=i;render();}},
      h('span',{class:'sn'},S2.solved?'✓':String(i)),h('span',{},h('b',{},x.name),h('br'),h('small',{},lock?'locked':x.warm?'optional':x.extension?'extension':S2.solved?'complete':'to do')));}));
  const next=(P.solved||P.revealed)&&si<STAGES.length-1?h('button',{class:'btn accent',onclick:()=>{B.stage++;render();}},`Next: ${STAGES[si+1].name} →`):null;
  return h('div',{},
    h('div',{class:'top'},h('h2',{},'Build it: binary search'),h('button',{class:'btn ghost',onclick:()=>{buildInit();render();}},'Start again')),
    h('div',{class:'prompt'},h('b',{},'Task: '),'Build the binary search in stages. Each stage ticks off mark-scheme points for 2022 Q4. Stage 0 is an optional linear search warm-up.'),
    bar,h('div',{class:'prompt',style:'background:var(--panel)'},h('b',{},`Stage ${si}: ${st.name}. `),st.prompt),
    h('div',{class:'pgrid'},h('div',{class:'panel'},h('h3',{},'Line bank'),bank),
      h('div',{},h('div',{class:'panel'},h('h3',{},'Your pseudo-code'),ol),
        h('div',{class:'actions'},h('button',{class:'btn primary',disabled:!P.answer.length||null,onclick:check},'Check'),
          h('button',{class:'btn ghost',onclick:()=>{const k=P.solved;B.st[si]={answer:[],marks:null,fb:null,solved:k,revealed:false};render();}},'Reset'),
          h('button',{class:'btn ghost',onclick:reveal},'Show answer'),next),
        P.fb?h('div',{class:'fb '+(P.fb.ok?'ok':'bad')},h('b',{},P.fb.summary),P.fb.items.length?h('ul',{},...P.fb.items.map(t=>h('li',{},t))):null):null),
      meter));
}

/* ================= SHELL ================= */
const TABS=[['Trace It',traceView],['Fix the flowchart',fixView],['Alter it',alterView],['Race',raceView],['Build it',buildView]];
function render(){
  const nav=document.getElementById('tabs');nav.innerHTML='';
  TABS.forEach(([t],i)=>nav.appendChild(h('button',{role:'tab','aria-selected':String(i===S.tab),onclick:()=>{S.tab=i;render();}},h('span',{class:'n'},String(i+1)),t)));
  const main=document.getElementById('main');main.innerHTML='';main.appendChild(TABS[S.tab][1]());
}
document.addEventListener('keydown',e=>{if(S.tab!==0||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;const T=S.tr,s=TG.steps[T.i],blocked=T.mode==='predict'&&s.ask&&!T.ans[`${T.alg}:${T.preset}:${T.i}`];
  if(e.key==='ArrowRight'&&T.i<TG.steps.length-1&&!blocked){T.i++;render();}else if(e.key==='ArrowLeft'&&T.i>0){T.i--;render();}});
render();

</script>
