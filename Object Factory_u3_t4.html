<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Object Factory</title>
<style>
:root {
  --navy: #003366; --amber: #CC9900;
  --bg: #F3F6FA; --surface: #FFFFFF; --surface-2: #E8EEF5; --text: #1A1A1A; --muted: #4A5A70;
  --heading: #003366; --accent: #CC9900; --accent-text: #7A5C00; --line: #C9D3E0;
  --code-bg: #003366; --code-text: #FFFFFF; --code-cmt: #F2D88A; --code-new: rgba(204,153,0,0.35);
  --right: #2E7D32; --right-bg: #E6F2E7; --wrong: #B23A3A; --wrong-bg: #F8E6E6; --soft: #FAF1D6;
  --inh: #CC9900; --own: #003366; --on-tag: #FFFFFF;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A2B; --surface: #16263D; --surface-2: #1E3250; --text: #E9EEF5; --muted: #A9B8CC;
    --heading: #F2F5FA; --accent: #E0B23A; --accent-text: #E0B23A; --line: #2C4466;
    --code-bg: #0A1422; --code-text: #F2F5FA; --code-cmt: #E0B23A; --code-new: rgba(224,178,58,0.25);
    --right: #6CC070; --right-bg: #1C3424; --wrong: #E07A7A; --wrong-bg: #3A1F24; --soft: #2E2814;
    --inh: #B88A10; --own: #3D6FA8; --on-tag: #FFFFFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A2B; --surface: #16263D; --surface-2: #1E3250; --text: #E9EEF5; --muted: #A9B8CC;
  --heading: #F2F5FA; --accent: #E0B23A; --accent-text: #E0B23A; --line: #2C4466;
  --code-bg: #0A1422; --code-text: #F2F5FA; --code-cmt: #E0B23A; --code-new: rgba(224,178,58,0.25);
  --right: #6CC070; --right-bg: #1C3424; --wrong: #E07A7A; --wrong-bg: #3A1F24; --soft: #2E2814;
  --inh: #B88A10; --own: #3D6FA8; --on-tag: #FFFFFF; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-size: 1.05rem; line-height: 1.5; }
h1, h2, h3 { font-family: Cambria, Caladea, Georgia, "Times New Roman", serif; color: var(--heading); line-height: 1.25; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); color: #FFFFFF; }
.bar-inner { max-width: 1280px; margin: 0 auto; padding: 0.65rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.bar h1 { color: #FFFFFF; margin: 0; font-size: 1.45rem; flex: 1 1 12rem; }
.bar h1 small { display: block; font-family: Calibri, Carlito, Arial, sans-serif; font-weight: 400; font-size: 0.85rem; color: #F2D88A; }
.bar button { font: inherit; font-size: 0.92rem; padding: 0.42rem 0.8rem; border-radius: 6px; cursor: pointer; background: transparent; color: #FFFFFF; border: 1px solid rgba(255,255,255,0.55); }
.bar button:hover { background: rgba(255,255,255,0.12); }
.stages { max-width: 1280px; margin: 0 auto; padding: 0 1.25rem 0.6rem; display: flex; gap: 0.4rem; flex-wrap: wrap; }
.stages button { font: inherit; font-size: 0.92rem; padding: 0.35rem 0.85rem; border-radius: 999px; cursor: pointer; background: transparent; color: #FFFFFF; border: 1px solid rgba(255,255,255,0.45); }
.stages button[aria-current="step"] { background: var(--amber); border-color: var(--amber); color: #1A1A1A; font-weight: 700; }
.stages button.done::after { content: " ✓"; }
.stages button:disabled { opacity: 0.4; cursor: default; }

main { max-width: 1280px; margin: 0 auto; padding: 1rem 1.25rem 3rem; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.15rem; }
.panel + .panel { margin-top: 1rem; }
.panel h2 { margin: 0 0 0.4rem; font-size: 1.25rem; }
.task { color: var(--text); margin: 0 0 0.75rem; }
.kicker { font-weight: 700; color: var(--accent-text); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 0.2rem; }
.row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin: 0.4rem 0; }
.row label { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--muted); gap: 0.15rem; }
input[type=text], input[type=number], select { font: inherit; font-size: 1rem; padding: 0.4rem 0.55rem; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); min-width: 0; }
input[type=text] { width: 9.5rem; } input[type=number] { width: 5rem; }
.btn { font: inherit; font-weight: 700; cursor: pointer; padding: 0.45rem 0.95rem; border-radius: 8px; border: 2px solid var(--accent); background: var(--accent); color: #1A1A1A; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); font-weight: 400; }
.btn:disabled { opacity: 0.45; cursor: default; }
.mbtn { font-family: "Courier New", Courier, monospace; font-size: 0.86rem; cursor: pointer; padding: 0.25rem 0.5rem; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); }
.mbtn:hover { border-color: var(--accent); }
.mbtn.danger { border-color: var(--wrong); }
.msg { margin-top: 0.5rem; padding: 0.45rem 0.7rem; border-radius: 8px; border: 2px solid var(--line); font-size: 0.95rem; }
.msg.ok { border-color: var(--right); background: var(--right-bg); }
.msg.no { border-color: var(--wrong); background: var(--wrong-bg); }

.objs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.65rem; margin-top: 0.6rem; }
.obj { border: 2px solid var(--line); border-radius: 10px; padding: 0.55rem 0.65rem; background: var(--surface); transition: border-color 0.3s, box-shadow 0.3s; }
.obj.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.obj-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.4rem; }
.obj-var { font-family: "Courier New", Courier, monospace; font-weight: 700; color: var(--heading); font-size: 1.05rem; }
.obj-cls { font-size: 0.8rem; color: var(--muted); }
.attrs { margin: 0.35rem 0; font-family: "Courier New", Courier, monospace; font-size: 0.88rem; }
.attr { display: flex; justify-content: space-between; gap: 0.4rem; align-items: center; padding: 0.1rem 0; }
.tag { font-family: Calibri, Carlito, Arial, sans-serif; font-size: 0.72rem; font-weight: 700; color: var(--on-tag); padding: 0.05rem 0.45rem; border-radius: 999px; white-space: nowrap; }
.tag.inh { background: var(--inh); } .tag.own { background: var(--own); }
.mrow { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin-top: 0.3rem; }
.mrow select { font-size: 0.85rem; padding: 0.2rem 0.3rem; }
.empty { color: var(--muted); margin: 0.4rem 0 0; }

.prompt { background: var(--soft); border-radius: 10px; padding: 0.75rem 0.9rem; margin-top: 0.9rem; }
.prompt h3 { margin: 0 0 0.3rem; font-size: 1.05rem; }
.prompt textarea { font: inherit; width: 100%; min-height: 3.4rem; resize: vertical; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 0.4rem 0.55rem; margin: 0.3rem 0; }
.reveal { margin-top: 0.6rem; border: 2px solid var(--right); background: var(--right-bg); border-radius: 8px; padding: 0.55rem 0.75rem; }
.reveal .term { font-family: Cambria, Caladea, Georgia, serif; font-weight: 700; font-size: 1.2rem; color: var(--heading); }
.locked { color: var(--muted); font-size: 0.92rem; }

pre.code { margin: 0; background: var(--code-bg); color: var(--code-text); border-radius: 10px; padding: 0.75rem 0.9rem; font-family: "Courier New", Courier, monospace; font-size: 0.86rem; line-height: 1.45; overflow-x: auto; max-height: 34rem; overflow-y: auto; }
pre.code .c { color: var(--code-cmt); }
pre.code .n { background: var(--code-new); display: inline-block; min-width: 100%; }
.out { margin-top: 0.6rem; background: var(--surface-2); border-radius: 8px; padding: 0.5rem 0.7rem; font-family: "Courier New", Courier, monospace; font-size: 0.86rem; min-height: 2.2rem; white-space: pre-wrap; }
.out .err { color: var(--wrong); font-weight: 700; }
.log ol { margin: 0; padding: 0; list-style: none; max-height: 16rem; overflow-y: auto; }
.log li { padding: 0.4rem 0; border-bottom: 1px solid var(--line); font-size: 0.93rem; }
.log li:last-child { border-bottom: none; }
.log li.exam { border-left: 4px solid var(--accent); padding-left: 0.55rem; }
.hidden { display: none !important; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .obj { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <h1>Object Factory<small>Unit 3 Topic 4, Lesson 2: method first</small></h1>
    <button type="button" id="restartBtn">Start again</button>
    <button type="button" id="themeBtn">Dark mode</button>
  </div>
  <nav class="stages" id="stages" aria-label="Stages"></nav>
</header>

<main>
  <div>
    <section class="panel" id="stagePanel" aria-live="polite"></section>
    <section class="panel">
      <h2>Your game world</h2>
      <div class="objs" id="objs"></div>
    </section>
  </div>
  <div>
    <section class="panel">
      <h2>The code so far <span style="font-family:Calibri,Carlito,Arial,sans-serif;font-size:0.9rem;font-weight:400;color:var(--muted)">(Python; new lines highlighted)</span></h2>
      <pre class="code" id="code"></pre>
      <div class="out" id="out" aria-live="polite">Output appears here.</div>
    </section>
    <section class="panel log">
      <h2>Factory log <span style="font-family:Calibri,Carlito,Arial,sans-serif;font-size:0.9rem;font-weight:400;color:var(--muted)">(newest first; amber = exam sentence)</span></h2>
      <ol id="log"></ol>
    </section>
  </div>
</main>

<script>
(function () {
  "use strict";
  var MODELS = ["knight", "wizard", "archer", "mage"];
  var STAGES = [
    { title: "Make characters",
      task: "Use the template to make at least two characters, each with a different name and model.",
      question: "What is the relationship between the template and the characters you made?",
      term: "Class and object",
      ms: "A class is a template or blueprint for a specific object: it defines the object’s variables (attributes/properties) and behaviour (methods). An object is an instance of a class: an actual thing created using the template." },
    { title: "Call methods",
      task: "Use the method buttons on your characters: change one character’s model with setModel(), and ask another for its name with getName(). Watch which character changes.",
      question: "Why did only one character’s model change?",
      term: "Method and state",
      ms: "A method is a programmed behaviour or subroutine included in an object of a class. It acts on the data of the object it is called on. The values of an object’s attributes are its state." },
    { title: "Try to break in",
      task: "Try to get at a character’s model without using a method: read it directly with print(…__model). Then try setModel(\"dragon\").",
      question: "Why might a programmer want to stop the rest of the program getting at the data directly?",
      term: "Encapsulation",
      ms: "Encapsulation bundles the data and the methods that act on it into a single unit and restricts access to the object’s internal state. A method can only access data within its own object, which makes data more secure." },
    { title: "Make new types",
      task: "Make one Player and one NPC from the Character template. Look at what each new object has, and what was written in its own class.",
      question: "What did Player and NPC get without it being written again?",
      term: "Inheritance",
      ms: "A subclass inherits the attributes and methods of its superclass, then adds its own. Methods can be inherited from parent classes, which reduces code duplication." },
    { title: "Same call, different results",
      task: "Call describe() on every object in your game world with one loop. Compare the answers.",
      question: "The loop makes exactly the same call each time. Why are the results different?",
      term: "Polymorphism",
      ms: "Polymorphism: different objects respond in their own way to the same method call. Each subclass can override a method with its own version." }
  ];

  var state, logItems = [];
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function q(s) { return '"' + s + '"'; }

  function fresh() {
    return { stage: 0, unlocked: 0, objs: [], calls: [], newLines: [], done: STAGES.map(function () { return false; }), revealed: STAGES.map(function () { return false; }),
      answers: STAGES.map(function () { return ""; }), s2: { setModel: false, getName: false }, s3: { read: false, bad: false }, msg: null, output: "" };
  }

  function log(html, exam) { logItems.unshift({ html: html, exam: !!exam }); renderLog(); }
  function renderLog() {
    document.getElementById("log").innerHTML = logItems.length ? logItems.map(function (l) { return '<li' + (l.exam ? ' class="exam"' : '') + '>' + l.html + '</li>'; }).join("") : "<li>Nothing yet.</li>";
  }

  function varName(name) {
    var base = name.toLowerCase().replace(/[^a-z]/g, "") || "char";
    var v = base, n = 2;
    while (state.objs.some(function (o) { return o.v === v; })) { v = base + n; n++; }
    return v;
  }
  function addCall(line) { state.calls.push(line); state.newLines = [line]; }
  function flash(o) { o.flash = true; setTimeout(function () { o.flash = false; renderObjs(); }, 900); }
  function byVar(v) { for (var i = 0; i < state.objs.length; i++) if (state.objs[i].v === v) return state.objs[i]; return null; }

  // ---------- code generation ----------
  function codeLines() {
    var s = state.unlocked, L = [];
    L.push("class Character:");
    L.push("    def __init__(self, name, model):");
    L.push("        self.__name = name" + "      # attribute (private)");
    L.push("        self.__model = model" + "    # attribute (private)");
    L.push("");
    L.push("    def getName(self):              # method");
    L.push("        return self.__name");
    L.push("");
    L.push("    def setModel(self, model):      # method");
    if (s >= 2) {
      L.push("        if model in [\"knight\", \"wizard\", \"archer\", \"mage\"]:");
      L.push("            self.__model = model");
    } else {
      L.push("        self.__model = model");
    }
    if (s >= 4) {
      L.push("");
      L.push("    def describe(self):");
      L.push("        return self.__name + \" is a character\"");
    }
    if (s >= 3) {
      L.push("");
      L.push("class Player(Character):            # inherits from Character");
      L.push("    def __init__(self, name, model, controls):");
      L.push("        super().__init__(name, model)");
      L.push("        self.__controls = controls");
      L.push("");
      L.push("    def move(self):");
      L.push("        print(self.getName() + \" moves\")");
      if (s >= 4) {
        L.push("");
        L.push("    def describe(self):             # overrides");
        L.push("        return self.getName() + \" is playing\"");
      }
      L.push("");
      L.push("class NPC(Character):               # inherits from Character");
      L.push("    def __init__(self, name, model, dialogue):");
      L.push("        super().__init__(name, model)");
      L.push("        self.__dialogue = dialogue");
      L.push("");
      L.push("    def interact(self):");
      L.push("        print(self.__dialogue)");
      if (s >= 4) {
        L.push("");
        L.push("    def describe(self):             # overrides");
        L.push("        return self.getName() + \" can talk\"");
      }
    }
    L.push("");
    L.push("# ---- the program ----");
    state.objs.forEach(function (o) { L.push(o.line); });
    state.calls.slice(-8).forEach(function (c) { L.push(c); });
    return L;
  }
  function renderCode() {
    var lines = codeLines();
    document.getElementById("code").innerHTML = lines.map(function (l) {
      var h = esc(l).replace(/(#.*)$/, '<span class="c">$1</span>');
      return state.newLines.indexOf(l) >= 0 ? '<span class="n">' + h + '</span>' : h;
    }).join("\n");
    var out = document.getElementById("out");
    out.innerHTML = state.output || "Output appears here.";
  }

  // ---------- objects ----------
  function attrRow(name, val, inh) {
    return '<div class="attr"><span>' + name + ' = ' + esc(val) + '</span>' + (inh === null ? '' : '<span class="tag ' + (inh ? 'inh' : 'own') + '">' + (inh ? 'from Character' : 'own') + '</span>') + '</div>';
  }
  function modelSelect(o) {
    return '<select data-sel="' + o.v + '" aria-label="Model for ' + o.v + '">' + (state.unlocked >= 2 ? MODELS.concat(["dragon"]) : MODELS).map(function (m) { return '<option>' + m + '</option>'; }).join("") + '</select>';
  }
  function renderObjs() {
    var wrap = document.getElementById("objs");
    if (!state.objs.length) { wrap.innerHTML = '<p class="empty">No objects yet. Make one with the controls above.</p>'; return; }
    var s = state.unlocked;
    wrap.innerHTML = state.objs.map(function (o) {
      var sub = o.cls !== "Character";
      var h = '<div class="obj' + (o.flash ? ' flash' : '') + '"><div class="obj-head"><span class="obj-var">' + o.v + '</span><span class="obj-cls">object of class ' + o.cls + '</span></div>';
      h += '<div class="attrs">' + attrRow("name", q(o.name), sub ? true : null) + attrRow("model", q(o.model), sub ? true : null);
      if (o.cls === "Player") h += attrRow("controls", q(o.controls), false);
      if (o.cls === "NPC") h += attrRow("dialogue", q(o.dialogue), false);
      h += '</div>';
      if (s >= 1) {
        h += '<div class="mrow">' + '<button type="button" class="mbtn" data-act="getName" data-v="' + o.v + '">getName()</button>' +
          '<button type="button" class="mbtn" data-act="setModel" data-v="' + o.v + '">setModel(…)</button>' + modelSelect(o) + '</div>';
      }
      if (s >= 2) h += '<div class="mrow"><button type="button" class="mbtn danger" data-act="direct" data-v="' + o.v + '">print(' + o.v + '.__model)</button></div>';
      if (o.cls === "Player") h += '<div class="mrow"><button type="button" class="mbtn" data-act="move" data-v="' + o.v + '">move()</button><span class="tag own">Player’s own</span></div>';
      if (o.cls === "NPC") h += '<div class="mrow"><button type="button" class="mbtn" data-act="interact" data-v="' + o.v + '">interact()</button><span class="tag own">NPC’s own</span></div>';
      return h + '</div>';
    }).join("");
    // keep selects showing current model
    state.objs.forEach(function (o) { var sel = wrap.querySelector('select[data-sel="' + o.v + '"]'); if (sel) sel.value = o.model; });
  }

  // ---------- stage panel ----------
  function makeForm(kind) {
    var extra = "";
    if (kind === "Player") extra = '<label>Controls<select id="fExtraPlayer"><option>keyboard</option><option>controller</option><option>touch</option></select></label>';
    if (kind === "NPC") extra = '<label>Dialogue<input type="text" id="fExtraNPC" value="Croeso!" maxlength="30"></label>';
    return '<div class="row"><label>Name<input type="text" id="fName' + kind + '" maxlength="12" placeholder="e.g. Gwen"></label>' +
      '<label>Model<select id="fModel' + kind + '">' + MODELS.map(function (m) { return '<option>' + m + '</option>'; }).join("") + '</select></label>' + extra +
      '<button type="button" class="btn" data-act="create" data-kind="' + kind + '">' + kind + '(…)</button></div>';
  }
  function renderStage() {
    var i = state.stage, st = STAGES[i];
    var h = '<p class="kicker">Stage ' + (i + 1) + ' of 5</p><h2>' + st.title + '</h2><p class="task">' + st.task + '</p>';
    if (i === 0) h += makeForm("Character");
    if (i === 3) h += '<p class="task" style="margin-bottom:0.2rem"><strong>Make a Player</strong></p>' + makeForm("Player") + '<p class="task" style="margin:0.6rem 0 0.2rem"><strong>Make an NPC</strong></p>' + makeForm("NPC");
    if (i === 4) h += '<div class="row"><button type="button" class="btn" data-act="describeAll">for c in world: print(c.describe())</button></div>';
    if (i >= 1 && i <= 2) h += '<p class="locked">Use the buttons on the objects under <em>Your game world</em>.</p>';
    if (state.msg) h += '<div class="msg ' + state.msg.cls + '">' + state.msg.html + '</div>';
    h += '<div class="prompt"><h3>Talk with your partner</h3><p style="margin:0">' + st.question + '</p>';
    h += '<label class="hidden" for="ans">Your answer</label><textarea id="ans" placeholder="Your answer…">' + esc(state.answers[i]) + '</textarea>';
    if (!state.done[i]) h += '<p class="locked">Finish the task above to unlock the term.</p>';
    else if (!state.revealed[i]) h += '<button type="button" class="btn" data-act="reveal">Reveal the term</button>';
    else {
      h += '<div class="reveal"><span class="term">' + st.term + '</span><p style="margin:0.25rem 0 0">' + st.ms + '</p></div>';
      h += '<div class="row" style="margin-top:0.7rem">' + (i < 4 ? '<button type="button" class="btn" data-act="next">Next stage →</button>' : '<strong>All five stages complete.</strong>') + '</div>';
    }
    h += '</div>';
    document.getElementById("stagePanel").innerHTML = h;
    var ta = document.getElementById("ans");
    ta.addEventListener("input", function () { state.answers[i] = ta.value; });
  }
  function renderStages() {
    document.getElementById("stages").innerHTML = STAGES.map(function (st, i) {
      return '<button type="button" data-stage="' + i + '"' + (i === state.stage ? ' aria-current="step"' : '') + (i > state.unlocked ? ' disabled' : '') + (state.revealed[i] ? ' class="done"' : '') + '>' + (i + 1) + '. ' + st.title + '</button>';
    }).join("");
  }
  function render() { renderStages(); renderStage(); renderObjs(); renderCode(); }

  function setMsg(cls, html) { state.msg = { cls: cls, html: html }; }
  function checkDone() {
    var i = state.stage;
    if (i === 0) state.done[0] = state.done[0] || state.objs.filter(function (o) { return o.cls === "Character"; }).length >= 2;
    if (i === 1) state.done[1] = state.done[1] || (state.s2.setModel && state.s2.getName);
    if (i === 2) state.done[2] = state.done[2] || (state.s3.read && state.s3.bad);
    if (i === 3) state.done[3] = state.done[3] || (state.objs.some(function (o) { return o.cls === "Player"; }) && state.objs.some(function (o) { return o.cls === "NPC"; }));
  }

  // ---------- actions ----------
  function create(kind) {
    var nameEl = document.getElementById("fName" + kind);
    var name = nameEl.value.trim();
    if (!/^[A-Za-z][A-Za-z ']{0,11}$/.test(name)) { setMsg("no", "Type a name of up to 12 letters first."); render(); return; }
    var model = document.getElementById("fModel" + kind).value;
    var o = { cls: kind, name: name, model: model, v: varName(name) };
    var args = q(name) + ", " + q(model);
    if (kind === "Player") { o.controls = document.getElementById("fExtraPlayer").value; args += ", " + q(o.controls); }
    if (kind === "NPC") { o.dialogue = (document.getElementById("fExtraNPC").value.trim() || "Croeso!"); args += ", " + q(o.dialogue); }
    o.line = o.v + " = " + kind + "(" + args + ")";
    state.objs.push(o); state.newLines = [o.line]; flash(o);
    if (kind === "Character") {
      var n = state.objs.filter(function (x) { return x.cls === "Character"; }).length;
      setMsg("ok", "Created <code>" + o.v + "</code>, object number " + n + " made from the same Character template." + (n < 2 ? " Make another." : ""));
      log("Created " + o.v + " from Character with name = " + q(esc(name)) + " and model = " + q(model) + ".");
    } else {
      setMsg("ok", "Created <code>" + o.v + "</code> from " + kind + ". Look at its card: name and model came from Character; " + (kind === "Player" ? "controls" : "dialogue") + " was written in " + kind + ".");
      log("Created " + o.v + " from " + kind + ". It has name and model even though " + kind + " never declares them.");
    }
    state.output = "";
    checkDone(); render();
  }
  function call(act, v) {
    var o = byVar(v); if (!o) return;
    if (act === "getName") {
      addCall("print(" + v + ".getName())");
      state.output = esc(o.name);
      if (state.stage === 1) state.s2.getName = true;
      setMsg("ok", "<code>" + v + ".getName()</code> returned " + q(esc(o.name)) + ": the method read the data inside that object.");
      log(v + ".getName() returned " + q(esc(o.name)) + ".");
      flash(o);
    } else if (act === "setModel") {
      var m = document.querySelector('select[data-sel="' + v + '"]').value;
      addCall(v + ".setModel(" + q(m) + ")");
      if (state.unlocked >= 2 && MODELS.indexOf(m) < 0) {
      state.calls[state.calls.length - 1] += "   # rejected"; state.newLines = [state.calls[state.calls.length - 1]];
        state.output = "(nothing changed: \"" + m + "\" is not an allowed model)";
        if (state.stage === 2) state.s3.bad = true;
        setMsg("no", "<code>setModel(\"" + m + "\")</code> was rejected: the method checks the value before changing the private data. " + v + " is still a " + o.model + ".");
        log(v + ".setModel(\"" + m + "\") rejected by the method's check.");
      } else {
        var others = state.objs.filter(function (x) { return x !== o; }).map(function (x) { return x.v; });
        var old = o.model; o.model = m;
        state.output = "";
        if (state.stage === 1) state.s2.setModel = true;
        setMsg("ok", "<code>" + v + ".setModel(\"" + m + "\")</code> changed " + v + "’s model from " + old + " to " + m + "." + (others.length ? " " + others.join(", ") + " did not change." : ""));
        log(v + ".setModel(\"" + m + "\"): only " + v + "'s state changed.");
      }
      flash(o);
    } else if (act === "direct") {
      addCall("print(" + v + ".__model)        # error");
      state.output = '<span class="err">AttributeError:</span> \'' + o.cls + '\' object has no attribute \'__model\'';
      if (state.stage === 2) state.s3.read = true;
      setMsg("no", "Blocked. <code>__model</code> is private: code outside the class can’t get at it. Only the object’s own methods can.");
      log("print(" + v + ".__model) raised an error: the attribute is private.");
    } else if (act === "move") {
      addCall(v + ".move()"); state.output = esc(o.name) + " moves";
      setMsg("ok", "<code>move()</code> belongs to Player only."); flash(o);
    } else if (act === "interact") {
      addCall(v + ".interact()"); state.output = esc(o.dialogue);
      setMsg("ok", "<code>interact()</code> belongs to NPC only."); flash(o);
    }
    checkDone(); render();
  }
  function describeAll() {
    if (!state.objs.length) return;
    state.newLines = ["world = [" + state.objs.map(function (o) { return o.v; }).join(", ") + "]", "for c in world:", "    print(c.describe())"];
    state.calls.push(state.newLines[0], state.newLines[1], state.newLines[2]);
    state.output = state.objs.map(function (o) {
      return esc(o.name) + (o.cls === "Player" ? " is playing" : o.cls === "NPC" ? " can talk" : " is a character");
    }).join("\n");
    state.objs.forEach(flash);
    state.done[4] = true;
    setMsg("ok", "One loop, one call: <code>c.describe()</code>. Each object ran its own class’s version.");
    log("Called describe() on " + state.objs.length + " objects: " + state.objs.length + " answers depending on each object's class.");
    render();
  }
  function reveal() {
    var i = state.stage;
    state.revealed[i] = true;
    if (i + 1 > state.unlocked && i < 4) state.unlocked = i + 1;
    log("<strong>" + STAGES[i].term + ".</strong> " + STAGES[i].ms, true);
    render();
  }
  function goStage(i) {
    if (i > state.unlocked) return;
    state.stage = i; state.msg = null; state.newLines = [];
    if (i === 2) setMsg("ok", "New: each object now has a <code>print(…__model)</code> button, and <code>setModel()</code> checks the value. Try both.");
    if (i === 4) setMsg("ok", "New: <code>describe()</code> has been added to Character, and overridden in Player and NPC. Look at the code panel.");
    render();
    window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var act = b.getAttribute("data-act");
    if (b.hasAttribute("data-stage")) { goStage(Number(b.getAttribute("data-stage"))); return; }
    if (act === "create") create(b.getAttribute("data-kind"));
    else if (act === "describeAll") describeAll();
    else if (act === "reveal") reveal();
    else if (act === "next") goStage(state.stage + 1);
    else if (act) call(act, b.getAttribute("data-v"));
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id && e.target.id.indexOf("fName") === 0) create(e.target.id.slice(5));
  });
  document.getElementById("restartBtn").addEventListener("click", function () { state = fresh(); logItems = []; log("Started again."); render(); });

  var themeBtn = document.getElementById("themeBtn");
  function isDark() { var t = document.documentElement.getAttribute("data-theme"); if (t) return t === "dark"; return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches; }
  function labelTheme() { themeBtn.textContent = isDark() ? "Light mode" : "Dark mode"; }
  themeBtn.addEventListener("click", function () {
    var nx = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nx);
    try { localStorage.setItem("u3t4-factory-theme", nx); } catch (err) {}
    labelTheme();
  });
  try { var sv = localStorage.getItem("u3t4-factory-theme"); if (sv === "light" || sv === "dark") document.documentElement.setAttribute("data-theme", sv); } catch (err) {}
  labelTheme();

  state = fresh();
  renderLog(); render();
  window.__factory = { getState: function () { return state; } };
})();
</script>
</body>
